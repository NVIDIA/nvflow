default:
  tags:
    - llm-mlops
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install -q uv

stages:
  - lint
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/

# =============================================================================
# LINT STAGE
# =============================================================================
lint:
  stage: lint
  image: python:3.12-slim
  script:
    - uv sync --all-extras
    - uv run pre-commit run --all-files
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# DCO sign-off check – only meaningful on MR pipelines where we validate
# developer commits.  Post-merge pipelines on main contain GitLab-generated
# merge commits that never carry Signed-off-by lines.
dco-check:
  stage: lint
  image: python:3.12-slim
  script:
    - python scripts/check_dco.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# =============================================================================
# TEST STAGE
# =============================================================================
test:
  stage: test
  image: python:3.12-slim
  script:
    # Lightweight install: skip heavy core deps (nemo-skills ~200+ packages)
    # that unit tests don't need.  Only install the project + test deps.
    - uv venv --python 3.12
    - uv pip install -e ".[dev]" --no-deps
    - uv pip install pytest pytest-cov pytest-xdist pytest-timeout PyYAML omegaconf rich
    # --no-sync prevents `uv run` from implicitly auto-installing heavy core
    # deps (nemo-skills etc) that we deliberately skipped above.  Without it,
    # tests would pass here for the wrong reason and fail on GitHub CI.
    - uv run --no-sync pytest tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# =============================================================================
# BUILD STAGE
# =============================================================================
build:
  stage: build
  image: python:3.12-slim
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - git fetch --tags --force
    - git describe --tags || echo "No tags found"
    - pip install -q build hatch-vcs
  script:
    - python -m build
    - ls -la dist/
    - echo "Built version:" && ls dist/*.whl | sed 's/.*nvflow-\(.*\)-py3.*/\1/'
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# =============================================================================
# PUBLISH STAGE
# =============================================================================
publish:
  stage: publish
  image: python:3.12-slim
  interruptible: false
  before_script:
    - pip install -q twine
  script:
    - |
      echo "Publishing to GitLab Package Registry..."
      echo "Project ID: ${CI_PROJECT_ID}"
      echo "Package files:"
      ls -la dist/
    - >
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      TWINE_USERNAME=gitlab-ci-token
      python -m twine upload
      --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
      --verbose
      dist/*
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
