default:
  # The lint/test/build jobs need git for VCS dependencies and hatch-vcs.
  # Official Python images do not provide it, so install it explicitly.
  image: python:3.12-slim
  tags:
    - llm-mlops
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --no-cache-dir -q uv

stages:
  - lint
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/

# =============================================================================
# LINT STAGE
# =============================================================================
lint:
  stage: lint
  script:
    - uv sync --all-extras
    - uv run pre-commit run --all-files
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# DCO sign-off check – only meaningful on MR pipelines where we validate
# developer commits.  Post-merge pipelines on main contain GitLab-generated
# merge commits that never carry Signed-off-by lines.
dco-check:
  stage: lint
  script:
    - python3 scripts/check_dco.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Mirrors .github/workflows/secrets-detector.yml.  The GitHub copy only runs on
# pull requests, and this repo opens one per release, so without this job a
# finding stays invisible until release day.  Keep the flags in sync with the
# GitHub workflow.
secrets-detector:
  stage: lint
  image: python:3.12-slim
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl > /dev/null
    - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
  script:
    # An empty --since-commit is not an error: TruffleHog drops the boundary and
    # scans every ref, so a secret on any branch fails an unrelated MR.  GitLab
    # leaves the base SHA empty when an MR has no diff (a sync branch already
    # containing its target), so resolve it ourselves.  --branch HEAD is the
    # other half: the base bounds history but not the set of refs, and runners
    # reuse build directories, so old refs/pipelines/* are otherwise in scope.
    - |
      BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        BASE="$(git merge-base FETCH_HEAD HEAD)"
      fi
      test -n "$BASE" || { echo "cannot resolve a scan base; refusing to scan every ref"; exit 1; }
      echo "scanning ${BASE}..HEAD"
      trufflehog git file://. --since-commit "$BASE" --branch HEAD --fail --no-update --results=verified,unknown --exclude-globs='*.whl'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The job above only sees one MR's commits, so nothing scans the other branches.
# This does, on a schedule, reporting rather than blocking (allow_failure) since
# findings usually live in someone else's branch.  Needs a schedule in
# Settings > CI/CD > Schedules to run at all.
secrets-audit-all-refs:
  stage: lint
  image: python:3.12-slim
  variables:
    GIT_DEPTH: 0
  allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl > /dev/null
    - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
  script:
    - git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
    - trufflehog git file://. --fail --no-update --results=verified,unknown --exclude-globs='*.whl'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# TEST STAGE
# =============================================================================
test:
  stage: test
  script:
    # Lightweight install: the project plus tests/requirements-ci.txt, but not
    # the heavy nemo-skills stack (~200 packages incl. torch).  Tests that
    # genuinely need nemo-skills use pytest.importorskip and skip here; the
    # test-full-deps job below runs them.  The dependency list is shared with
    # .github/workflows/unit-tests.yml — edit it there, in one place.
    - uv venv --python 3.12
    - uv pip install -e . --no-deps
    - uv pip install -r tests/requirements-ci.txt
    # --no-sync prevents `uv run` from implicitly auto-installing heavy core
    # deps (nemo-skills etc) that we deliberately skipped above.  Without it,
    # tests would pass here for the wrong reason and fail on GitHub CI.
    - uv run --no-sync pytest tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# test_rollout.py and test_verify.py importorskip nemo_skills, which the job above
# does not install: 54 of the suite's 300 tests skipped in both pipelines until
# this job.  Mirrored by test-full-deps in .github/workflows/unit-tests.yml.
test-full-deps:
  stage: test
  image: python:3.12-slim
  script:
    - uv sync --all-extras
    # Assert the gated import, or this passes by skipping them again.
    - uv run python -c "import nemo_skills"
    - uv run pytest tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# =============================================================================
# BUILD STAGE
# =============================================================================
build:
  stage: build
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - git fetch --tags --force
    - git describe --tags || echo "No tags found"
    - pip install --no-cache-dir -q build hatch-vcs
  script:
    - python -m build
    - ls -la dist/
    - echo "Built version:" && ls dist/*.whl | sed 's/.*nvflow-\(.*\)-py3.*/\1/'
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# =============================================================================
# PUBLISH STAGE
# =============================================================================
publish:
  stage: publish
  image: python:3.12-slim
  interruptible: false
  before_script:
    - pip install --no-cache-dir -q twine
  script:
    - |
      echo "Publishing to GitLab Package Registry..."
      echo "Project ID: ${CI_PROJECT_ID}"
      echo "Package files:"
      ls -la dist/
    - >
      TWINE_PASSWORD=${CI_JOB_TOKEN}
      TWINE_USERNAME=gitlab-ci-token
      python -m twine upload
      --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
      --verbose
      dist/*
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
