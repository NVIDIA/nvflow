# Ray Cluster Configuration Template — EXPERIMENTAL
#
# Running on pre-provisioned Ray clusters is experimental; Slurm is the only
# officially supported executor. See the Ray setup guide for the full walkthrough.
#
# Copy this file, then fill in the dashboard URLs + your endpoint key:
#   cp cluster_configs/template-ray.yaml cluster_configs/my_cluster.yaml
#
# Bring up the clusters with scripts/start_ray_on_slurm.sb (run once per cluster);
# it prints each dashboard URL to paste below. cluster_configs/*.yaml is git-ignored
# (only the tracked templates are committed), so it is safe to keep keys here.

# Required field even in Mode 3: nemo-skills reads cluster_config["executor"] in many
# non-Ray code paths (mounts, HF-home check, run_after, server config) and the config
# loader does NOT default it, so it must be set here. "none" = no nemo-run executor; the
# Ray Jobs backend does the submitting. Do NOT use "ray" — that selects the Mode-1
# ray-as-scheduler path and trips the with_ray incompatibility guard.
executor: none

backend:
  name: ray

  # Ray Jobs API dashboard URL of each pre-provisioned cluster (http://<head>:<port>).
  # nvflow auto-routes each stage by its GPU request — GPU stages (training, rollout)
  # to the nemo-rl cluster, CPU stages (data-prep, eval) to the nemo-skills cluster —
  # exactly as Slurm splits partition / cpu_partition. A stage may override the
  # inference with `target_cluster: cpu|gpu`.
  gpu_nemo_rl_dashboard_url:     http://<gpu-cluster-head>:8265
  cpu_nemo_skills_dashboard_url: http://<cpu-cluster-head>:8266
  # Single cluster instead? Delete both *_dashboard_url lines above and set the generic shorthand
  # the Ray Jobs backend reads directly — works for BOTH `nflow run <stage>` and `run-all`:
  #     dashboard_url: http://<head>:8265
  # (A lone gpu_nemo_rl_dashboard_url only takes effect through run-all's per-stage routing; a
  # single-stage `nflow run` then fails: `use_with_ray_cluster is only supported for SlurmExecutor`.)

# Container image per role. On a pre-provisioned Ray cluster the image is already running,
# so these paths are not used to launch jobs — but the keys must be present so each stage's
# `container:` selector resolves (and maps to the right cluster above).
containers:
  nemo-rl:     <PATH_TO_CONTAINERS>/nvflow-nemo-rl.sqsh      # GPU cluster (training, rollout)
  nemo-skills: <PATH_TO_CONTAINERS>/nvflow-nemo-skills.sqsh  # CPU cluster (data-prep, eval)

# Host:container mount pairs visible to every Ray job (models / data / outputs).
# /workspace MUST be the nvflow repo checkout — the driver imports nvflow and the
# finance recipes from /workspace, and stage outputs are written under it.
mounts:
  - <CLUSTER_PATH_TO_NVFLOW_REPO>:/workspace   # the nvflow repo checkout
  - <CLUSTER_PATH_TO_HF_MODELS>:/hf_models

# Env var names (or NAME=value literals) forwarded into each Ray job. PYTHONPATH=/workspace is
# REQUIRED: every stage submits `python -m nvflow...` to the cluster, and the image bakes nemo_skills
# but NOT nvflow — this puts the /workspace repo mount on the job's PYTHONPATH so the import resolves.
# Without it, the very first stage fails with `ModuleNotFoundError: No module named 'nvflow'`.
# The remaining entries forward the BYO generation/judge API key (jobs run with the cluster head's
# environment). The GRPO/gym judge reads OPENAI_API_KEY by default (lib/rl/helpers.py); the
# nemo-skills eval judge against api.nvidia.com uses NVIDIA_API_KEY instead (auto-picked). Keep secrets out of git.
env_vars:
  - PYTHONPATH=/workspace  # REQUIRED so submitted Ray jobs can import nvflow from the repo mount
  - OPENAI_API_KEY         # GRPO / BYO-OpenAI judge (the key the gym judge reads by default)
  # - NVIDIA_API_KEY       # nemo-skills eval judge against api.nvidia.com
  # - HF_TOKEN
