# Container Image References
#
# This file defines the Docker images used by setup_containers.sh
# to create .sqsh container images for Slurm.
#
# This is a TEMPLATE -- do not edit this file directly.
# Copy it to a personal file and update with your registry paths:
#
#   cp cluster_configs/containers.yaml cluster_configs/my_containers.yaml
#   # Edit my_containers.yaml with your registry paths
#   mkdir -p outputs/logs
#   sbatch --account=<YOUR_SLURM_ACCOUNT> --partition=<CPU_PARTITION> \
#     scripts/setup_containers.sh --config cluster_configs/my_containers.yaml ./containers
#
# Naming:
#   YAML KEYS (nemo-rl, nemo-gym, nemo-skills, vllm, sglang) match the
#   short names the workflow code uses to look up containers -- do NOT rename
#   them.  Only the values (registry/tag refs) change between deployments.
#
# Format:
#   - Simple string: image reference (e.g., your-registry/nvflow-nemo-skills:v1.2.0)
#   - Nested object: Platform-specific tags (amd64/arm64 keys)
#
# Built from dockerfiles/:
#   nemo-rl     -> dockerfiles/Dockerfile.nemo-rl     (NeMo-RL v0.8.0 + the Gym environments GRPO trains with)
#   nemo-gym    -> dockerfiles/Dockerfile.nemo-gym    (NeMo-Gym v0.7.0 + the Gym environments NVFlow's workflows use)
#   nemo-skills -> dockerfiles/Dockerfile.nemo-skills (base: ubuntu:22.04, NeMo-Skills @ bcf059af)
#   vllm        -> official vLLM v0.29.0 CUDA 13 wheel + dockerfiles/Dockerfile.vllm
#   sglang      -> official SGLang 0.5.17 wheels + dockerfiles/Dockerfile.sglang
#
# Optional launcher image for airgapped users (airgap-only; NOT a worker -- see
# the nvflow-client entry below):
#   nvflow-client -> dockerfiles/Dockerfile.nvflow   (base: digest-pinned ubuntu:24.04; multi-arch amd64+arm64)

containers:
  # ---------------------------------------------------------------------------
  # Required: images built from dockerfiles/ (see INSTALL.md, Worker Images).
  # Their environments are built in, so jobs install nothing at runtime.
  # ---------------------------------------------------------------------------
  # Tested: nvflow-nemo-rl:v0.8.0 (SFT/GRPO trainer; multi-arch amd64 + arm64).
  nemo-rl: <YOUR_REGISTRY>/nvflow-nemo-rl:v0.8.0

  # Tested: nvflow-nemo-gym:v0.7.0 (native Gym data plane; multi-arch amd64 + arm64).
  nemo-gym: <YOUR_REGISTRY>/nvflow-nemo-gym:v0.7.0

  # Tested: nvflow-nemo-skills:v1.2.0 (NeMo-Skills at the commit NVFlow pins,
  # on Ray 2.58.0)
  nemo-skills: <YOUR_REGISTRY>/nvflow-nemo-skills:v1.2.0

  # Tested: nvflow-vllm:v0.29.0 (matches NeMo-RL 0.8.0's generation;
  # pre-cached tiktoken + openai_harmony; multi-arch amd64 + arm64).
  vllm: <YOUR_REGISTRY>/nvflow-vllm:v0.29.0

  # nvflow-sglang:v0.5.17-ray2.58.0 (Python 3.13.14 and Ray 2.58.0; multi-arch),
  # required only by workflows whose model profiles select SGLang.
  sglang: <YOUR_REGISTRY>/nvflow-sglang:v0.5.17-ray2.58.0

  # ---------------------------------------------------------------------------
  # OPTIONAL -- launcher image, ONLY for users in an airgapped environment who
  # cannot `uv sync` / pip-install. It is NOT a worker and is NOT referenced by
  # my_cluster.yaml `containers:`; it bundles the `nvflow` CLI + baked venv to
  # drive NVFlow over an ssh_tunnel with no host install and no user-side internet.
  # The default lightweight bootstrap remains `uv sync` (README / INSTALL.md).
  # Built multi-arch (amd64 + arm64) from dockerfiles/Dockerfile.nvflow; see
  # docs/operations/remote-launch.md.
  #
  # Uncomment only when staging the optional airgapped launcher image.
  # ---------------------------------------------------------------------------
  # nvflow-client: <YOUR_REGISTRY>/nvflow-client:v1.2.0

  # ---------------------------------------------------------------------------
  # Optional: Not currently used by NVFlow recipes
  # Uncomment and update if needed for your workflows.
  # ---------------------------------------------------------------------------
  # trtllm: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc8
  # megatron: <YOUR_REGISTRY>/nemo-skills-megatron:<TAG>
  # sandbox: <YOUR_REGISTRY>/nemo-skills-sandbox:<TAG>
  # verl: <YOUR_REGISTRY>/nemo-skills-verl:<TAG>
