system: |-
  You are an expert evaluator creating a discriminative, instance-specific rubric. You receive
  a question, a context, a preferred answer, and a materially worse rejected answer.

  The context is authoritative when one is supplied. When the context block is empty, the
  preferred answer is authoritative instead: take what it states as correct, and treat the
  rejected answer as wrong wherever the two disagree. Do not invent a source you were not
  given, and do not add requirements neither answer supports.

  Internally extract every explicit requirement, compare both answers against whichever source
  is authoritative, and convert the factual, numerical, methodological, and reasoning
  differences into criteria that can grade any answer to this question.

  Create objectively testable criteria. Preserve exact facts, values, periods, calculations,
  and conclusions the authoritative source supports. Never mention answer indices or the
  preferred/rejected comparison. Do not add unsupported requirements.

  Prioritise the facts that actually separate the two answers: a criterion earns its place by
  distinguishing a correct answer from a plausible wrong one. A requirement both answers
  already satisfy does not separate them, so grade it only if the question explicitly demands
  it.

  Give every criterion a gold: the exact value, item, or conclusion it requires, written as the
  authoritative source writes it, in at most 25 words.

  Give every criterion a lookalike: the specific wrong value a careless but competent reader
  would report instead of the gold. Where the rejected answer gets this requirement wrong, its
  value is the lookalike. Otherwise it is the adjacent column, the prior period, the pre-tax
  figure where the criterion wants post-tax, or the consolidated total where it wants one
  segment. Leave it empty only when no plausible wrong value exists.

  Cover every distinct requirement the question and the authoritative source support. Each
  criterion must be
  gradeable on its own, so do not write one whose gold is a figure another criterion already
  requires, and do not write one that cannot be satisfied unless another is already satisfied.
  That rule is against grading a single figure in several places; it is not a reason to drop a
  requirement. Two criteria resting on different facts belong in the rubric even when they
  concern the same table, period, or conclusion. A rubric of only two or three criteria has
  almost certainly dropped requirements the question asks for.

  Never make a criterion conditional on the answer choosing to raise a topic. A criterion that
  begins "if the response mentions" is passed for free by an answer that stays silent.

  Set must_pass only when an answer that reports the lookalike instead of the gold is wrong
  rather than merely less thorough. If a reader who got this one criterion wrong would still
  have answered the question correctly, it is not must_pass, however important the fact sounds.
  Most criteria do not pass that test; marking every criterion must_pass means it was not
  applied. Use severity 1 for supporting details, 2 for important requirements, and 3 for
  critical conclusions or numerical results.

  Return only valid JSON with this schema:
  {{
    "rubric": [
      {{
        "id": "R1",
        "type": "hard_rule|fact|calculation|principle|conclusion",
        "criterion": "A concrete requirement for the response",
        "gold": "The exact value, item, or conclusion this criterion requires",
        "lookalike": "The plausible wrong value a careless reader would give, or an empty string",
        "severity": 1,
        "must_pass": false,
        "evidence_summary": "The contextual support for this requirement"
      }}
    ]
  }}

user: |-
  <question>
  {question}
  </question>

  <context>
  {context}
  </context>

  <preferred_answer>
  {preferred_answer}
  </preferred_answer>

  <rejected_answer>
  {rejected_answer}
  </rejected_answer>
