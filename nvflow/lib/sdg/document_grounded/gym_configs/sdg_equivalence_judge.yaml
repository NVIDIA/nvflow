# ============================================================================
# SDG overlay for upstream NeMo-Gym equivalence_llm_judge environment.
# ============================================================================
# Used when SDG needs an LLM judge to score the generated answer against an
# expected answer.  Per-record `expected_answer` is injected into each input
# record by `responses_api.py` (see `extra_record_field_mappers` in workflow
# YAMLs).
#
# Requires a `judge_model` model server defined in the het-group alongside the
# `policy_model` (see `judge_vllm` block in stage config).  The judge prompt
# template path defaults to the SDG-shipped template below and can be
# overridden per stage.
#
# Usage in workflow YAML:
#   gym_config_paths:
#     - nvflow/lib/sdg/document_grounded/gym_configs/sdg_equivalence_judge.yaml
#   gym_agent_name: sdg_equivalence_judge_simple_agent
# ============================================================================

sdg_equivalence_judge:
  resources_servers:
    equivalence_llm_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: judge_model
      judge_responses_create_params:
        input: []
      judge_endpoint_max_concurrency: 64
      judge_equal_label: "[[A=B]]"
      judge_not_equal_label: "[[A!=B]]"
      # Disable upstream per-record-regex / rescue / swap features by default —
      # SDG callers can re-enable them via stage overrides.
      use_per_record_regex: false
      check_full_generation_on_fail: false
      check_twice_swap: false
      # See sdg_format_verification.yaml for the allowed `domain` values —
      # SDG isn't a Gym task domain, so `other`.
      domain: other
      verified: false
      description: SDG-side reuse of equivalence_llm_judge for answer scoring
      value: Provide LLM-as-judge reward signal for SDG answer evaluation

sdg_equivalence_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        # See sdg_format_verification.yaml — `name` is the top-level YAML group key
        # (`sdg_equivalence_judge`), not the inner key (`equivalence_llm_judge`).
        name: sdg_equivalence_judge
      model_server:
        type: responses_api_models
        name: policy_model
