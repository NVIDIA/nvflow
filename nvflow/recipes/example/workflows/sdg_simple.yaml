# Example SDG Workflow - Simple synthetic data generation
# This demonstrates a basic single-stage workflow

recipe: example

workflow:
  name: "sdg_simple"
  type: "sdg"
  description: "Simple SDG pipeline for generating synthetic training data"

cluster: my_cluster

# Repo is mounted at /workspace on cluster (see cluster_configs/my_cluster.yaml)
base_data_dir: /workspace/outputs/example/sdg_simple

pipeline_stages:
  - generate_answer

stages:
  generate_answer:
    # run_name: "v1"  # Optional: add to distinguish multiple experiment runs
    input_file: nvflow/recipes/example/data/input/data.jsonl
    output_dir: ${base_data_dir}/step-1-generate-answer
    prompt_config: nvflow/recipes/example/prompts/generate_answer.yaml
    inline_args: "++inference.temperature=0.7 ++inference.top_p=0.9"
    dependencies: []
    stage_kwargs:
      # Model server configuration
      model: /hf_models/Qwen/Qwen3-4B
      server_type: vllm           # or sglang, trtllm
      server_gpus: 1
      server_nodes: 1

      # Generation parameters
      num_random_seeds: 1
      num_chunks: 1

      # Slurm configuration
      # partition is resolved from cluster config (partition / cpu_partition)
