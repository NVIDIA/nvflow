# ============================================================================
# Finance OpenQA Judge Overlay for NeMo-Gym equivalence_llm_judge
# ============================================================================
# Overrides the default STEM judge prompt file with a finance-aware prompt
# that is more accurate for open-ended financial questions (Risk, Analysis,
# Comparison).
#
# This overlay only replaces judge_prompt_template_fpath.  All other
# environment settings (swap check, per-record regex,
# reward_if_full_generation_succeeds, etc.) are inherited from the base
# equivalence_llm_judge.yaml.
#
# Usage: add as the LAST entry in nemo_gym_config_paths so it overrides the
# base prompt file path (OmegaConf merge: last wins).
#
#   nemo_gym_config_paths:
#     - responses_api_models/vllm_model/configs/vllm_model.yaml
#     - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
#     - nvflow/recipes/finance/prompts/finance_openqa_judge_overlay.yaml
#
# Prompt file: finance_openqa_judge.txt (same directory)
# Adapted from: nvflow/recipes/finance/prompts/sec_judge.yaml
# Key changes from the default STEM prompt:
#   - Domain: financial reasoning (SEC filings, ratios, risk factors)
#   - Focus: measures correctness, not completeness; partial credit → equivalent
#   - Rounding: forgiving of minor numerical differences
#   - Reasoning: ignores <think> tags, focuses on final answer
#   - Examples: finance-specific (revenue, ratios, risk analysis)
#
# Note: upstream Gym commit 0123486b (Feb 2026) replaced the inline
# judge_prompt_template field with file-based judge_prompt_template_fpath.
# This overlay uses the file-based approach for compatibility.
# ============================================================================

equivalence_llm_judge:
  resources_servers:
    equivalence_llm_judge:
      judge_prompt_template_fpath: /nemo_run/code/nvflow/recipes/finance/prompts/finance_openqa_judge.txt
