# ============================================================================
# Baseline Model Evaluation
# ============================================================================
# Evaluate all baseline (pre-trained) models on finance benchmarks.
# This is the only standalone eval workflow — checkpoint evaluations
# are embedded in the SFT and GRPO training pipelines.
#
# Usage:
#   uv run nflow run-all --config nvflow/recipes/finance/workflows/eval/baselines.yaml
#   uv run nflow run qwen3-14b --config nvflow/recipes/finance/workflows/eval/baselines.yaml
# ============================================================================

_base_: base.yaml

recipe: finance
workflow:
  name: eval
  type: "evaluation"
  description: "Evaluate baseline models on finance benchmarks"

cluster: my_cluster
base_output_dir: /workspace/outputs/finance/sap-500/workflow-1-baseline-eval

# Inference presets (YAML anchors are file-scoped, so redefined here)
.qwen3_inference: &qwen3_inference
  server_type: vllm
  inference_args: >-
    ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
    ++inference.temperature=0.6
    ++inference.top_p=0.95
    ++inference.top_k=20
    ++inference.tokens_to_generate=16384
    ++chat_template_kwargs.enable_thinking=true
  server_args: "--max-model-len 40960 --async-scheduling --reasoning-parser qwen3"

.nemotron_nano_inference: &nemotron_nano_inference
  server_type: vllm
  inference_args: >-
    ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
    ++chat_template_kwargs.enable_thinking=true
    ++inference.temperature=1.0
    ++inference.top_p=1.0
    ++inference.tokens_to_generate=32768
  server_args: "--max-model-len 65536 --async-scheduling --mamba_ssm_cache_dtype float32"

pipeline_stages:
  - prepare_data
  - qwen3-4b
  - qwen3-14b
  - qwen3-32b
  - gpt-oss-120b
  - nemotron-nano-9b-v2
  - nemotron-3-nano-30b

models:
  qwen3-4b:
    path: /hf_models/Qwen/Qwen3-4B
    <<: *qwen3_inference
    dependencies: [prepare_data]
    gpus: 1
    nodes: 1

  qwen3-14b:
    path: /hf_models/Qwen/Qwen3-14B
    <<: *qwen3_inference
    dependencies: [prepare_data]
    gpus: 1
    nodes: 1

  qwen3-32b:
    path: /hf_models/Qwen/Qwen3-32B
    <<: *qwen3_inference
    dependencies: [prepare_data]
    gpus: 2
    nodes: 1

  gpt-oss-120b:
    path: /hf_models/openai/gpt-oss-120b
    server_type: vllm
    dependencies: [prepare_data]
    gpus: 2
    nodes: 1
    inference_args: >-
      ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
      ++inference.tokens_to_generate=32768
      ++chat_template_kwargs.reasoning_effort=high
    server_args: "--max-model-len 65536 --async-scheduling"

  nemotron-nano-9b-v2:
    path: /hf_models/nvidia/NVIDIA-Nemotron-Nano-9B-v2
    server_type: vllm
    dependencies: [prepare_data]
    gpus: 1
    nodes: 1
    inference_args: >-
      ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
      ++parse_reasoning=True
      ++inference.tokens_to_generate=32768
      ++inference.temperature=0.6
      ++inference.top_p=0.95
      ++system_message='/think'
    server_args: "--max-model-len 65536 --async-scheduling --mamba_ssm_cache_dtype float32"

  nemotron-3-nano-30b:
    path: /hf_models/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    <<: *nemotron_nano_inference
    dependencies: [prepare_data]
    gpus: 2
    nodes: 1
