# ============================================================================
# Demo Baseline Evaluation (3 models)
# ============================================================================
# Evaluate Qwen3-4B, Gemma 3 4B IT, and GPT-OSS 20B on finance benchmarks.
# Covers reasoning (Qwen3), standard chat (Gemma), and MoE (GPT-OSS) families.
#
# Usage:
#   uv run nflow run-all --config nvflow/recipes/finance/workflows/eval/demo.yaml
# ============================================================================

_base_: base.yaml

recipe: finance
workflow:
  name: eval
  type: "evaluation"
  description: "Demo baseline evaluation (Qwen3-4B, Gemma-3-4B-IT, GPT-OSS-20B)"

cluster: my_cluster
base_output_dir: /workspace/outputs/finance/demo/workflow-1-baseline-eval

# Local vLLM judge (overrides OpenAI default in base.yaml)
judge:
  model: /hf_models/openai/gpt-oss-120b
  server_type: vllm
  server_address: null
  server_gpus: 2
  server_nodes: 1
  server_args: "--max-model-len 32768 --async-scheduling"
  extra_args: >-
    ++prompt_config=/workspace/nvflow/recipes/finance/prompts/sec_judge.yaml
    ++inference.temperature=0.0
    ++inference.tokens_to_generate=8192
    ++generation_key=judgement
    ++skip_extraction=True

pipeline_stages:
  - prepare_data
  - qwen3-4b
  - gemma-3-4b-it
  - gpt-oss-20b

# Demo uses only SecQUE and FinanceBench
benchmarks:
  secque:
    seeds: 5
  financebench:
    seeds: 5

stages:
  prepare_data:
    dataset_names: [secque, financebench]
    output_dir: /workspace/nvflow/recipes/finance/datasets

models:
  qwen3-4b:
    path: /hf_models/Qwen/Qwen3-4B
    server_type: vllm
    dependencies: [prepare_data]
    inference_args: >-
      ++prompt_config=/workspace/nvflow/recipes/finance/prompts/secque_template.yaml
      ++inference.temperature=0.6
      ++inference.top_p=0.95
      ++inference.top_k=20
      ++inference.tokens_to_generate=16384
      ++chat_template_kwargs.enable_thinking=true
    server_args: "--max-model-len 40960 --async-scheduling --reasoning-parser qwen3 --tensor-parallel-size 2"
    gpus: 4
    nodes: 1

  gemma-3-4b-it:
    path: /hf_models/google/gemma-3-4b-it
    server_type: vllm
    dependencies: [prepare_data]
    # Max output context is 8192 tokens (hard limit: https://huggingface.co/google/gemma-3-4b-it)
    inference_args: >-
      ++prompt_config=/workspace/nvflow/recipes/finance/prompts/secque_template.yaml
      ++inference.tokens_to_generate=8192
    server_args: "--max-model-len 40960 --async-scheduling --tensor-parallel-size 2"
    gpus: 4
    nodes: 1

  gpt-oss-20b:
    path: /hf_models/openai/gpt-oss-20b
    server_type: vllm
    dependencies: [prepare_data]
    inference_args: >-
      ++prompt_config=/workspace/nvflow/recipes/finance/prompts/secque_template.yaml
      ++inference.tokens_to_generate=32768
      ++chat_template_kwargs.reasoning_effort=high
    server_args: "--max-model-len 65536 --async-scheduling --tensor-parallel-size 4"
    gpus: 4
    nodes: 1
