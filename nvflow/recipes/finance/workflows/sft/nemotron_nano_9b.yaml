# ============================================================================
# NVIDIA-Nemotron-Nano-9B-v2 SFT Training Configuration
# ============================================================================
# Inherits shared pipeline logic from base.yaml and provides all
# Nemotron-Nano-9B-v2 specific settings (tokenizer, model paths, parallelism).
#
# Model: https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-9B-v2
# Architecture: Mamba2-Transformer Hybrid (4 attention layers)
# Context Length: 128K
# Reasoning: Thinking model - uses /think system prompt to enable reasoning
#
# Usage:
#   uv run nflow run-all --config workflows/sft/nemotron_nano_9b.yaml
# ============================================================================

# Inherit base SFT workflow
_base_: base.yaml

# Use cluster config with Nemotron-Nano-9B-v2 container support
cluster: my_cluster_nemotron

# Model-specific output directory (use /workspace for cluster mounts)
base_output_dir: /workspace/outputs/finance/sap-500/workflow-4-sft/nemotron_nano_9b

# ============================================================================
# Model-Specific Stage Overrides
# ============================================================================

stages:

  # --------------------------------------------------------------------------
  # Stage 1: Prepare for SFT - Nemotron-Nano-9B tokenizer
  # --------------------------------------------------------------------------
  # Nemotron uses /think system prompt to enable reasoning (not enable_thinking)
  prepare_for_sft:
    prepare_data_kwargs:
      ctx_args: >-
        ++tokenizer=/hf_models/nvidia/NVIDIA-Nemotron-Nano-9B-v2
        ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
        ++system_message="/think"

  # --------------------------------------------------------------------------
  # Stage 3: Sequence Length Grouping - Nemotron-Nano-9B tokenizer
  # --------------------------------------------------------------------------
  sequence_length_grouping:
    tokenizer_path: /hf_models/nvidia/NVIDIA-Nemotron-Nano-9B-v2

  # --------------------------------------------------------------------------
  # Stage 4: Training - Nemotron-Nano-9B-v2 configuration (NeMo-RL format)
  # --------------------------------------------------------------------------
  training:
    model_name: nvidia/NVIDIA-Nemotron-Nano-9B-v2
    hf_checkpoint_path: /hf_models/nvidia/NVIDIA-Nemotron-Nano-9B-v2

    # Use Megatron backend (standard for Nemotron-Nano-9B)
    backend: megatron

    # Cluster configuration for 9B model
    total_gpus: 16
    dependent_jobs: 1         # Test resume with 1 dependent job

    # Use base preset with model-specific overrides
    preset: "sft-base"

    # Nemotron-Nano-9B specific configuration
    # All hyperparameters preserved from legacy nemotron-nano-9b preset
    overrides:
      sft:
        max_num_epochs: 1         # QUICK TEST CONFIG
        max_num_steps: 100        # Stop after 100 steps
        val_period: 50

        # === FULL TRAINING CONFIG (uncomment when ready) ===
        # max_num_epochs: 3
        # val_period: 100

      checkpointing:
        save_period: 50             # Quick test: save every 50 steps
        # save_period: 250          # Full training: save every 250 steps
        keep_top_k: 50
        checkpoint_must_save_by: "00:03:40:00"

      policy:
        train_global_batch_size: 16  # QUICK TEST: Smaller batch for faster iteration
        # train_global_batch_size: 128  # FULL TRAINING
        train_micro_batch_size: 1
        max_total_sequence_length: 49152  # 48K (matches max_token_length filter)

        # Megatron parallelism: TP × PP × CP = 4×1×4 = 16 (must equal total_gpus)
        megatron_cfg:
          tensor_model_parallel_size: 4
          pipeline_model_parallel_size: 1
          context_parallel_size: 4
          sequence_parallel: true
          activation_checkpointing: true
          bias_activation_fusion: true
          apply_rope_fusion: true      # Applies to 4 attention layers
          empty_unused_memory_level: 1  # Memory optimization (moderate)

          # Optimizer settings (from legacy nemotron-nano-9b preset)
          optimizer:
            optimizer: "adam"
            lr: 5e-6
            min_lr: 5e-7
            weight_decay: 0.01
            bf16: true
            clip_grad: 1.0
            use_distributed_optimizer: true

          # Scheduler settings
          scheduler:
            lr_decay_style: "cosine"
            lr_warmup_iters: 10       # QUICK TEST: Must be < max_num_steps
            # lr_warmup_iters: 2000   # FULL TRAINING
            lr_warmup_init: 1e-7

      data:
        force_reprocess: false
        num_workers: 10

    # Debug: understand the Python environment
    stage_kwargs:
      installation_command: >-
        echo "=== ENVIRONMENT DEBUG ===" &&
        echo "Which python: $(which python)" &&
        echo "Python version: $(python --version)" &&
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" &&
        echo "PYTHONPATH=$PYTHONPATH" &&
        echo "NEMO_RL_VENV_DIR=$NEMO_RL_VENV_DIR" &&
        echo "=== Check if datasets is installed ===" &&
        python -c "import datasets; print(f'datasets found: {datasets.__file__}')" || echo "datasets NOT found" &&
        echo "=== pip list | grep datasets ===" &&
        pip list | grep -i datasets || echo "No datasets in pip list" &&
        echo "=== Site packages location ===" &&
        python -c "import site; print(site.getsitepackages())" &&
        echo "=== Installing datasets explicitly ===" &&
        pip install datasets &&
        echo "=== Verify datasets after install ===" &&
        python -c "import datasets; print(f'datasets installed: {datasets.__file__}')" &&
        sed -i 's/hf_overrides=hf_overrides,//' /nemo_run/code/nemo_skills/training/nemo_rl/convert_megatron_to_hf.py
