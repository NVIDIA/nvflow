# ============================================================================
# Qwen3-4B SFT Training Configuration
# ============================================================================
# Inherits shared pipeline logic from base.yaml and provides all Qwen3-4B
# specific settings (tokenizer, model paths, parallelism, etc.)
#
# Usage:
#   uv run nflow run-all --config nvflow/recipes/finance/workflows/sft/qwen3_4b.yaml
# ============================================================================

# Inherit base SFT workflow
_base_: base.yaml

# Model identity (define once, reference everywhere via ${hf_model_path})
hf_model_path: /hf_models/Qwen/Qwen3-4B

# Model-specific output directory
base_output_dir: ${nvflow_root}/outputs/finance/demo/workflow-4-sft/qwen3_4b

directories:
  raw_train_data: ${nvflow_root}/outputs/finance/demo/workflow-3-template-based-sdg/step-5-filter-answers

# ============================================================================
# Pipeline Stages
# ============================================================================
pipeline_stages:
  - data_transformation
  - prepare_for_sft
  - train_validation_split
  - sequence_length_grouping
  - training
  - eval

# ============================================================================
# Model-Specific Stage Overrides
# ============================================================================

stages:

  # --------------------------------------------------------------------------
  # Stage 1: Prepare for SFT - Qwen3-4B tokenizer
  # --------------------------------------------------------------------------
  prepare_for_sft:
    prepare_data_kwargs:
      ctx_args: >-
        ++tokenizer=${hf_model_path}
        ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
        ++chat_template_kwargs.enable_thinking=true

  # --------------------------------------------------------------------------
  # Stage 3: Sequence Length Grouping - Qwen3-4B tokenizer
  # --------------------------------------------------------------------------
  sequence_length_grouping:
    tokenizer_path: ${hf_model_path}

  # --------------------------------------------------------------------------
  # Stage 4: Training - Qwen3-4B configuration (NeMo-RL format)
  # --------------------------------------------------------------------------
  training:
    model_name: Qwen/Qwen3-4B
    hf_checkpoint_path: ${hf_model_path}

    # Use Megatron backend (standard for Qwen3-4B)
    backend: megatron

    # Cluster configuration for 4B model
    total_gpus: 8
    dependent_jobs: 0        # No dependent jobs for demo

    # Use base preset with model-specific overrides
    preset: "sft-base"

    # Qwen3-4B specific configuration (only non-default values)
    overrides:
      sft:
        max_num_epochs: 2
        val_period: 1              # Validate every step

      checkpointing:
        save_period: 10            # Demo: checkpoint at end of each epoch (~9 steps/epoch)
        checkpoint_must_save_by: "00:03:40:00"

      policy:
        max_total_sequence_length: 32768  # 32K (matches max_token_length filter)

        # Sequence packing (required for Context Parallelism in Megatron)
        sequence_packing:
          enabled: true
          train_mb_tokens: 32768   # Match max_total_sequence_length

        # Megatron parallelism: TP × PP × CP = 2×1×2 = 4 → DP = 8/4 = 2
        megatron_cfg:
          tensor_model_parallel_size: 2
          context_parallel_size: 2    # 32K/2 = 16K tokens/rank
          sequence_parallel: true
          activation_checkpointing: true

          optimizer:
            min_lr: 5e-7            # Different from base (5e-6)

          scheduler:
            lr_decay_style: "cosine"
            lr_warmup_iters: 1      # Minimal warmup for demo
            lr_warmup_init: 1e-7

      data:
        max_input_seq_length: ${stages.training.overrides.policy.max_total_sequence_length}

  # --------------------------------------------------------------------------
  # Stage 5: Evaluate Checkpoints - Qwen3-4B
  # --------------------------------------------------------------------------
  eval:
    eval_steps: [10]
    checkpoint_path: ${directories.step-4-training}/model-qwen3-4b-${stages.training.total_gpus}g-tp2-pp1-cp2-seq32k
    base_output_dir: ${base_output_dir}
    format: megatron
    base_model: ${hf_model_path}
    server_type: vllm
    gpus: 4  # Slurm allocation (>= QOS min) AND the eval serve's TP: nemo-skills'
    # serve_vllm sets --tensor-parallel-size={gpus} and can't serve TP<gpus, so do
    # NOT add --tensor-parallel-size to server_args (it appends a duplicate flag).
    # Local vLLM judge (keeps the quick-start air-gapped; production SFT configs
    # inherit the gpt-5 judge from workflows/eval/base.yaml).
    judge:
      model: /hf_models/openai/gpt-oss-120b
      server_type: vllm
      server_address: null
      server_gpus: 4          # whole node: some clusters enforce a per-job GRES minimum (e.g. GB200 gpu:4)
      server_nodes: 1
      server_args: "--max-model-len 32768 --async-scheduling"
      extra_args: >-
        ++prompt_config=nvflow/recipes/finance/prompts/sec_judge.yaml
        ++inference.temperature=0.0
        ++inference.tokens_to_generate=8192
        ++generation_key=judgement
        ++skip_extraction=True
    # Demo: SecQUE and FinanceBench (skip finance_agent to save time)
    benchmarks:
      secque:
        seeds: 5
      financebench:
        seeds: 5
    inference_args: >-
      ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
      ++inference.temperature=0.6
      ++inference.top_p=0.95
      ++inference.top_k=20
      ++inference.tokens_to_generate=16384
      ++chat_template_kwargs.enable_thinking=true
    server_args: "--max-model-len 40960 --async-scheduling --reasoning-parser qwen3"
