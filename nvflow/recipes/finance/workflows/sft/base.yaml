# ============================================================================
# Finance Training Pipeline - Supervised Fine-Tuning (SFT) - BASE CONFIG
# ============================================================================
# Base config for SFT training pipeline. Contains shared pipeline logic,
# directory structure, and stage configurations. Model-specific settings
# (tokenizer, model paths, parallelism) must be provided by model configs.
#
# Usage:
#   # Always use a model config (required):
#   uv run nflow run-all --config workflows/sft/qwen3_14b.yaml
#   uv run nflow run-all --config workflows/sft/llama3_70b.yaml
#
# To add a new model:
#   1. Create workflows/sft/<model_name>.yaml
#   2. Set _base_: base.yaml
#   3. Provide model-specific settings (tokenizer, model paths, parallelism)
#   4. See qwen3_14b.yaml for reference
# ============================================================================

# Recipe identifier (defines which recipe this workflow belongs to)
recipe: finance

# Workflow metadata
workflow:
  name: "sft"                                 # Unique workflow name
  type: "training"                            # Workflow category
  description: "SFT training for financial reasoning"

# Cluster to run jobs on (references cluster_configs/<cluster>.yaml)
cluster: my_cluster

# Base directory for all pipeline outputs
# Override in model configs: base_output_dir: /workspace/outputs/finance/{demo,sap-500}/workflow-4-sft/<model_name>
base_output_dir: /workspace/outputs/finance/sap-500/workflow-4-sft

# ============================================================================
# Pipeline Stages - Execution Order
# ============================================================================
# Stages run in sequence. Each stage depends on the previous one's output.
pipeline_stages:
  - data_transformation           # Step 0: Transform raw dataset to training format
  - prepare_for_sft               # Step 1: Format data for SFT (applies prompt template)
  - train_validation_split        # Step 2: Split into train/val sets
  - sequence_length_grouping      # Step 3: Group train data by sequence length
  - training                      # Step 4: Run SFT training
  - eval                          # Step 5: Evaluate checkpoints on finance benchmarks

# ============================================================================
# Directory Structure - All Stage Outputs
# ============================================================================
# Defines where each stage writes its output. Uses ${base_output_dir} for consistency.
directories:
  raw_train_data: /workspace/outputs/finance/sap-500/workflow-3-template-based-sdg/step-5-filter-answers  # Raw SDG data
  step-0-data-transformation: ${base_output_dir}/step-0-data-transformation               # Transformed input data (chunked)
  step-1-prepare-for-sft: ${base_output_dir}/step-1-prepare-for-sft                       # Prepared training data
  step-2-train-validation-split: ${base_output_dir}/step-2-train-validation-split         # Train/val split
  step-3-sequence-length-grouping: ${base_output_dir}/step-3-sequence-length-grouping     # Grouped train data by sequence length
  step-4-training: ${base_output_dir}/step-4-training                                               # Model checkpoints
  step-5-eval: ${base_output_dir}/step-5-eval                                                         # Evaluation results
  step-5-convert-to-messages: ${base_output_dir}/step-5-convert-to-messages                           # OpenAI messages format (optional)

# ============================================================================
# Stage Configurations
# ============================================================================

stages:

  # --------------------------------------------------------------------------
  # Stage 0: Data Transformation
  # --------------------------------------------------------------------------
  # Transform SEC-QUE dataset format to standardized training format
  # - Renames fields: question->problem, source_info->context,
  #   answer_reasoning_content->reasoning_content, answer->generation
  # - Generates uuid: Deterministic hash based on question + answer content
  # - Outputs to chunks for prepare_for_sft memory efficiency
  data_transformation:
    input_files:
      - ${directories.raw_train_data}/final_result.jsonl                       # SDG data
    output_file: ${directories.step-0-data-transformation}/final_result.jsonl  # Single file output (unused when chunking)
    output_dir: ${directories.step-0-data-transformation}                      # Output directory (errors.jsonl saved here if any)

    # Chunking - split output for prepare_for_sft memory efficiency
    # Chunks saved to {output_dir}/chunks/
    num_chunks: 10

    # Source format - how the SDG data is structured:
    #   - "separated":   Reasoning model SDG with separate fields
    #   - "think_tags":  Reasoning model SDG with <think> tags in answer field
    #   - "inline":      Non-reasoning model SDG (keep as-is)
    source_format: separated

    # Reasoning mode - how to format generation for training:
    #   - "thinking": Wrap reasoning in <think> tags (Qwen3 style)
    #   - "natural":  Combine reasoning + answer without tags
    #   - "none":     Answer only, discard reasoning
    reasoning_mode: thinking

    # Outlier filtering configuration
    filter_outliers: true
    filter_config:
      context_min_percentile: 0.5
      context_max_percentile: 100
      reasoning_min_percentile: 0.25
      reasoning_max_percentile: 99.5

  # --------------------------------------------------------------------------
  # Stage 1: Prepare Data for SFT
  # --------------------------------------------------------------------------
  # Formats training data using nemo_skills.training.prepare_data
  # Applies prompt template, tokenizer chat formatting, and filters
  prepare_for_sft:
    input_dir: ${directories.step-0-data-transformation}/chunks  # Chunked data from data_transformation
    output_dir: ${directories.step-1-prepare-for-sft}            # Where to save prepared data

    # Data preparation arguments - MODEL-SPECIFIC (override in model configs)
    # prepare_data_kwargs:
    #   ctx_args: >-
    #     ++tokenizer=/path/to/tokenizer
    #     ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
    #     ++chat_template_kwargs.enable_thinking=true  # or ++system_message="/think"

    dependencies:
      - data_transformation

  # --------------------------------------------------------------------------
  # Stage 2: Train/Validation Split
  # --------------------------------------------------------------------------
  # Split prepared data into training and validation sets
  # Uses stratified sampling to maintain question_type distribution
  # Filters out samples exceeding max_token_length
  train_validation_split:
    input_file: ${directories.step-1-prepare-for-sft}/final_result.jsonl
    output_dir: ${directories.step-2-train-validation-split}

    # Split configuration
    val_ratio: 0.1              # 10% validation, 90% training
    stratify_by: question_type  # Maintain question_type distribution
    random_seed: 42             # For reproducibility
    max_token_length: 49152     # Filter samples > 48K tokens (48 × 1024)

    dependencies:
      - prepare_for_sft

  # --------------------------------------------------------------------------
  # Stage 3: Group Train Data by Sequence Length
  # --------------------------------------------------------------------------
  # Groups training examples by sequence length for efficient training
  # Validation set remains ungrouped (generic) for realistic evaluation
  sequence_length_grouping:
    input_file: ${directories.step-2-train-validation-split}/train.jsonl  # Only group train data
    output_dir: ${directories.step-3-sequence-length-grouping}
    # tokenizer_path - MODEL-SPECIFIC (override in model configs)

    # Group boundaries (total sequence length: input + output tokens)
    # Based on data stats: median ~23K tokens, P95 ~31K tokens
    bucket_sizes:
      - 16000   # ≤16K tokens (~12% of data)
      - 24000   # 16K-24K tokens (~38% of data)
      - 32000   # 24K-32K tokens (~38% of data)
      - 48000   # 32K-48K tokens (~10% of data)
      # overflow: >48K tokens (~2% of data)

    dependencies:
      - train_validation_split

  # --------------------------------------------------------------------------
  # Stage 4: Training (Supervised Fine-Tuning)
  # --------------------------------------------------------------------------
  training:
    # Data paths (shared across all models)
    training_data: ${directories.step-2-train-validation-split}/train.jsonl
    validation_data: ${directories.step-2-train-validation-split}/val.jsonl
    output_dir: ${directories.step-4-training}

    # MODEL-SPECIFIC - Override in model configs:
    # model_name, hf_checkpoint_path, total_gpus, preset, overrides

    dependencies:
      - train_validation_split
      - sequence_length_grouping

    # Cluster configuration (shared defaults)
    # total_gpus: total GPUs for the training job (auto-split across nodes
    # using gpus_per_node from the cluster config)
    total_gpus: 8
    dependent_jobs: 0
    backend: megatron

    # Experiment tracking
    wandb_project: finance-training
    wandb_mode: disabled        # online | offline | disabled

    # NeMo-RL source is overlay-mounted at /opt/NeMo-RL via my_cluster.yaml.
    # This provides pyproject.toml on all nodes for the Ray _env_builder,
    # and resolves the UV_PROJECT=/opt/NeMo-RL path used by training.py.

  # --------------------------------------------------------------------------
  # Stage 5: Evaluate Checkpoints on Finance Benchmarks
  # --------------------------------------------------------------------------
  # Evaluates training checkpoints at specified steps using nemo-skills.
  # Shared settings (benchmarks, judges, datasets) are loaded from
  # workflows/eval/base.yaml at runtime.
  #
  # MODEL-SPECIFIC - Override in model configs:
  # eval_steps, checkpoint_path, base_model, baseline_model, server_type, gpus,
  # eval_output_dir, inference_args, server_args
  eval:
    eval_output_dir: ${directories.step-5-eval}
    dependencies:
      - training
