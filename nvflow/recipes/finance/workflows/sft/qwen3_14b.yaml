# ============================================================================
# Qwen3-14B SFT Training Configuration
# ============================================================================
# Inherits shared pipeline logic from base.yaml and provides all Qwen3-14B
# specific settings (tokenizer, model paths, parallelism, etc.)
#
# Usage:
#   uv run nflow run-all --config workflows/sft/qwen3_14b.yaml
# ============================================================================

# Inherit base SFT workflow
_base_: base.yaml

# Model-specific output directory
base_output_dir: ${nvflow_root}/outputs/finance/sap-500/workflow-4-sft/qwen3_14b

# ============================================================================
# Pipeline Stages - Qwen3 includes convert_to_messages + eval
# ============================================================================
pipeline_stages:
  - data_transformation
  - prepare_for_sft
  - train_validation_split
  - sequence_length_grouping
  - training
  - convert_to_messages           # Qwen3-specific: Convert to OpenAI messages format
  - eval                          # Evaluate checkpoints on finance benchmarks

# ============================================================================
# Model-Specific Stage Overrides
# ============================================================================

stages:

  # --------------------------------------------------------------------------
  # Stage 1: Prepare for SFT - Qwen3-14B tokenizer
  # --------------------------------------------------------------------------
  prepare_for_sft:
    prepare_data_kwargs:
      ctx_args: >-
        ++tokenizer=/hf_models/Qwen/Qwen3-14B
        ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
        ++chat_template_kwargs.enable_thinking=true

  # --------------------------------------------------------------------------
  # Stage 3: Sequence Length Grouping - Qwen3-14B tokenizer
  # --------------------------------------------------------------------------
  sequence_length_grouping:
    tokenizer_path: /hf_models/Qwen/Qwen3-14B

  # --------------------------------------------------------------------------
  # Stage 4: Training - Qwen3-14B configuration (NeMo-RL format)
  # --------------------------------------------------------------------------
  training:
    model_name: Qwen/Qwen3-14B
    hf_checkpoint_path: /hf_models/Qwen/Qwen3-14B

    # Use Megatron backend (standard for Qwen3-14B)
    backend: megatron

    # Cluster configuration for 14B model
    # Training estimates: ~2,575 steps/epoch, ~7,725 total steps (3 epochs)
    total_gpus: 256
    dependent_jobs: 3         # 4 jobs per launch (~644 steps/job, ~6 ckpts/job)

    # Use base preset with model-specific overrides
    preset: "sft-base"

    # Qwen3-14B specific configuration
    # All hyperparameters preserved from legacy qwen-3-14b preset
    overrides:
      sft:
        max_num_epochs: 3
        val_period: 50              # Validate every 50 steps

      checkpointing:
        save_period: 100            # Full training: save every 100 steps
        keep_top_k: 50
        checkpoint_must_save_by: "00:03:40:00"

      policy:
        train_global_batch_size: 128
        train_micro_batch_size: 1
        max_total_sequence_length: 49152  # 48K (matches max_token_length filter)

        # Megatron parallelism: TP × PP × CP = 4×1×8 = 32 → DP = 256/32 = 8
        megatron_cfg:
          tensor_model_parallel_size: 4
          pipeline_model_parallel_size: 1
          context_parallel_size: 8    # 48K/8 = 6K tokens/rank (memory efficient)
          sequence_parallel: true
          activation_checkpointing: true
          bias_activation_fusion: true
          apply_rope_fusion: true
          empty_unused_memory_level: 1  # Memory optimization (moderate)

          # Optimizer settings (from legacy qwen-3-14b preset)
          optimizer:
            optimizer: "adam"
            lr: 5e-6
            min_lr: 5e-7
            weight_decay: 0.01
            bf16: true
            clip_grad: 1.0
            use_distributed_optimizer: true

          # Scheduler settings
          scheduler:
            lr_decay_style: "cosine"
            lr_warmup_iters: 2000
            lr_warmup_init: 1e-7

      data:
        num_workers: 10

  # --------------------------------------------------------------------------
  # Stage 5: Convert to Messages Format (Qwen3 only)
  # --------------------------------------------------------------------------
  # Converts train/val datasets to OpenAI messages format.
  # Input: train.jsonl, val.jsonl from train_validation_split (Qwen3 chat template)
  # Output: OpenAI messages format with structured messages array
  convert_to_messages:
    input_dir: ${directories.step-2-train-validation-split}
    output_dir: ${directories.step-5-convert-to-messages}

    # Extract reasoning_content from <think> tags in assistant output?
    extract_reasoning: true

    # SDG model used to generate the dataset (added to metadata)
    sdg_model: "openai/gpt-oss-120b"

    dependencies:
      - train_validation_split

  # --------------------------------------------------------------------------
  # Stage 6: Evaluate Checkpoints - Qwen3-14B
  # --------------------------------------------------------------------------
  eval:
    eval_steps: [2600, 5000, 7408]
    checkpoint_path: ${directories.step-4-training}/model-qwen3-14b-${stages.training.total_gpus}g-tp4-pp1-cp8-seq48k
    base_output_dir: ${base_output_dir}
    format: megatron
    baseline_model: /hf_models/Qwen/Qwen3-14B
    server_type: vllm
    gpus: 1
    inference_args: >-
      ++prompt_config=nvflow/recipes/finance/prompts/secque_template.yaml
      ++inference.temperature=0.6
      ++inference.top_p=0.95
      ++inference.top_k=20
      ++inference.tokens_to_generate=16384
      ++chat_template_kwargs.enable_thinking=true
    server_args: "--max-model-len 40960 --async-scheduling --reasoning-parser qwen3"
