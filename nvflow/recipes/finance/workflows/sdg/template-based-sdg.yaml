# ============================================================================
# Finance SDG Pipeline - Template-Based Approach - BASE CONFIG
# ============================================================================
# Production SDG pipeline for generating high-quality financial Q&A data.
# Each stage runs independently (no dependencies) for production flexibility.
#
# Usage:
#   # Production - run stages independently:
#   uv run nflow run-stage --config workflows/sdg/template-based-sdg.yaml --stage create_seed_data
#   uv run nflow run-stage --config workflows/sdg/template-based-sdg.yaml --stage generate_questions
#   uv run nflow run-stage --config workflows/sdg/template-based-sdg.yaml --stage generate_answers
#
#   # Demo - use the demo config for quick E2E runs:
#   uv run nflow run-all --config workflows/sdg/template-based-sdg-demo.yaml
#
# To customize:
#   1. Create workflows/sdg/<custom_name>.yaml
#   2. Set _base_: template-based-sdg.yaml
#   3. Override model paths, resources, etc.
#   4. See template-based-sdg-demo.yaml for reference
# ============================================================================

recipe: finance

workflow:
  name: "template_based_sdg"
  type: "sdg"
  description: "Template-based SDG pipeline for financial Q&A generation"

cluster: my_cluster

# ============================================================================
# Directory Configuration
# ============================================================================
# base_output_dir: Output root directory for this run (change for different runs)
# filings_dir: Directory containing SEC filings data (from download_sec_filings workflow)
# ============================================================================
base_output_dir: ${nvflow_root}/outputs/finance/sap-500/workflow-3-template-based-sdg
filings_dir: ${nvflow_root}/outputs/finance/sap-500/workflow-2-download-sec/step-0-download

# ============================================================================
# Directory Structure - All Stage Outputs
# ============================================================================
# Defines where each stage writes its output. Uses ${base_output_dir} for consistency.
directories:
  step-0-create-seed-data: ${base_output_dir}/step-0-create-seed-data
  step-1-generate-questions: ${base_output_dir}/step-1-generate-questions
  step-2-map-questions-to-context: ${base_output_dir}/step-2-map-questions-to-context
  step-3-generate-answers: ${base_output_dir}/step-3-generate-answers
  step-4-genselect-answers: ${base_output_dir}/step-4-genselect-answers
  step-5-filter-answers: ${base_output_dir}/step-5-filter-answers

# ============================================================================
# Pipeline Stages
# ============================================================================
pipeline_stages:
  - create_seed_data
  - generate_questions
  - map_questions_to_context
  - generate_answers
  - genselect_answers
  - filter_answers

# ============================================================================
# Stage Configurations (Production Defaults)
# ============================================================================
stages:

  # --------------------------------------------------------------------------
  # Stage 0: Create Seed Data
  # --------------------------------------------------------------------------
  # Downloads SecQue dataset from HuggingFace and fetches company info from Wikipedia
  # Optional filtering by company list and number of questions
  create_seed_data:
    output_file: ${directories.step-0-create-seed-data}/seed_questions.jsonl
    company_info_file: ${directories.step-0-create-seed-data}/company_info.tsv
    sec_identity_email: your.email@example.com  # UPDATE: Your email (required by SEC)
    sec_identity_company: YourCompany           # UPDATE: Your company name
    dependencies: []

  # --------------------------------------------------------------------------
  # Stage 1: Generate Questions
  # --------------------------------------------------------------------------
  # Uses LLM to generate financial reasoning questions from SEC filing metadata
  generate_questions:
    input_file: ${directories.step-0-create-seed-data}/seed_questions.jsonl
    company_info_file: ${directories.step-0-create-seed-data}/company_info.tsv
    output_file: ${directories.step-1-generate-questions}/final_result.jsonl
    prompt_config: nvflow/recipes/finance/prompts/generate_questions.yaml
    start_year: 2019
    end_year: 2024
    inline_args: "++inference.tokens_to_generate=32768 ++chat_template_kwargs.reasoning_effort=high"
    dependencies: [create_seed_data]
    stage_kwargs:
      model: /hf_models/openai/gpt-oss-120b
      server_type: vllm
      server_gpus: 8
      server_nodes: 1
      server_args: "--max-model-len 65536"

  # --------------------------------------------------------------------------
  # Stage 2: Map Questions to Context
  # --------------------------------------------------------------------------
  # Maps generated questions to relevant SEC filing content as context
  map_questions_to_context:
    input_file: ${directories.step-1-generate-questions}/final_result.jsonl
    output_file: ${directories.step-2-map-questions-to-context}/final_result.jsonl
    filings_dir: ${filings_dir}/data
    filings_metadata: ${filings_dir}/sec_metadata.parquet
    token_limit: 30000
    dependencies: [generate_questions]


  # --------------------------------------------------------------------------
  # Stage 3: Generate Answers
  # --------------------------------------------------------------------------
  # Uses LLM to generate answers with reasoning for each question+context pair
  generate_answers:
    input_file: ${directories.step-2-map-questions-to-context}/final_result.jsonl
    output_dir: ${directories.step-3-generate-answers}
    prompt_config: nvflow/recipes/finance/prompts/secque_template.yaml
    inline_args: "++chat_template_kwargs.reasoning_effort=high"
    dependencies: [map_questions_to_context]
    stage_kwargs:
      model: /hf_models/openai/gpt-oss-120b
      server_type: sglang
      server_gpus: 8
      server_nodes: 1
      num_chunks: 1
      num_random_seeds: 5
      server_args: "--reasoning-parser gpt-oss"

  # --------------------------------------------------------------------------
  # Stage 4: GenSelect Answers
  # --------------------------------------------------------------------------
  # Uses LLM to select the best answer from multiple generated candidates
  genselect_answers:
    input_dir: ${directories.step-3-generate-answers}
    output_file: ${directories.step-4-genselect-answers}/final_result.jsonl
    prompt_config: nvflow/recipes/finance/prompts/genselect_answers.yaml
    inline_args: "++inference.tokens_to_generate=16384 ++max_concurrent_requests=180"
    dependencies: [generate_answers]
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-235B-A22B-Instruct-2507-tp16-sglang
      server_type: sglang
      server_gpus: 8
      server_nodes: 2
      num_chunks: 10
      server_args: "--load-format sharded_state"


  # --------------------------------------------------------------------------
  # Stage 5: Filter Answers
  # --------------------------------------------------------------------------
  # Uses LLM to filter out unanswerable or low-quality QA pairs
  filter_answers:
    input_file: ${directories.step-4-genselect-answers}/final_result.jsonl
    output_file: ${directories.step-5-filter-answers}/final_result.jsonl
    prompt_config: nvflow/recipes/finance/prompts/filter_answers.yaml
    inline_args: "++generation_key=filter_generation"
    dependencies: [genselect_answers]
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-30B-A3B-Instruct-2507
      server_type: sglang
      server_gpus: 2
      server_nodes: 1
      num_chunks: 16
