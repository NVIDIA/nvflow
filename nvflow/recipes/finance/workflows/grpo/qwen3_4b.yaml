# ============================================================================
# Qwen3-4B GRPO Training Configuration
# ============================================================================
# GRPO RL training for Qwen3-4B-Instruct using NeMo-Gym environments.
# Inherits shared pipeline logic from base.yaml and provides all Qwen3-4B
# specific settings (model paths, parallelism, etc.)
#
# Usage:
#   uv run nflow run-all --config nvflow/recipes/finance/workflows/grpo/qwen3_4b.yaml
#
# Data:
#   data_transformation cleans raw SDG data, apply_prompt_template formats
#   the prompt and extracts expected answer, convert_to_responses_api converts
#   to NeMo-Gym format, train_validation_split splits into train/val, and
#   prepare_data adds agent_ref routing fields.  All paths are auto-wired.
#
# Environments:
#   Inherits from base.yaml; override per-env settings below as needed.
# ============================================================================

# Inherit base GRPO workflow
_base_: base.yaml

# Run scope: change data_root AND the finance_sec_search overlay together.
#   demo:     data_root: /workspace/outputs/finance/demo      + finance_sec_search_demo.yaml
#   sap-500:  data_root: /workspace/outputs/finance/sap-500   + finance_sec_search_sap500.yaml
data_root: /workspace/outputs/finance/demo

# Model identity (define once, reference everywhere via ${hf_model_path})
hf_model_path: /hf_models/Qwen/Qwen3-4B

# Model-specific output directory (stages 5-9: rollouts, compute_rewards,
# train_validation_split, training, eval write here)
model_output_dir: ${base_output_dir}/qwen3_4b

# ============================================================================
# Shared Anchors (define once, reuse across stages)
# ============================================================================
# GPT-OSS-120B as dedicated judge (MoE, fits on 2 GPUs).
_judge_vllm: &judge_vllm
  model_path: /hf_models/openai/gpt-oss-120b
  num_gpus: 2
  server_nodes: 1
  max_model_len: 32768
  async_scheduling: true
  uses_reasoning_parser: true

# Per-environment sequence length for equiv/mcqa (finance_sec_search uses 131K model default)
_env_seq_len_32k: 32768

_training_policy_32k: &training_policy_32k
  max_total_sequence_length: ${_env_seq_len_32k}
  hf_config_overrides: null   # No YaRN needed at 32K (native context is 40960)
  megatron_cfg:
    context_parallel_size: 1  # No CP needed at 32K (within native 40960 context)
  generation:
    vllm_cfg:
      max_model_len: ${_env_seq_len_32k}
  sequence_packing:
    enabled: true
    train_mb_tokens: ${_env_seq_len_32k}
    logprob_mb_tokens: ${_env_seq_len_32k}
  logprob_chunk_size: 2048
  make_sequence_length_divisible_by: 16

environments:
  equivalence_llm_judge:
    raw_train_data: /workspace/outputs/finance/demo/workflow-3-template-based-sdg/step-5-filter-answers
    judge_vllm: *judge_vllm
    training_policy: *training_policy_32k
  finance_sec_search:
    raw_train_data: ${base_output_dir}/step-0-validate-questions/finance_sec_search
    config_paths:
      - resources_servers/finance_sec_search/configs/finance_sec_search.yaml
      - /workspace/nvflow/recipes/finance/workflows/grpo/overlays/finance_sec_search_env.yaml
      - /workspace/nvflow/recipes/finance/workflows/grpo/overlays/finance_sec_search_demo.yaml
    policy_vllm:
      num_gpus: 4               # 4 GPUs doubles KV cache for 131K context concurrency
      max_model_len: 131072     # Extended via YaRN (native 40960); multi-turn tool calls need >40K
      hf_config_overrides:      # Applied via model overlay dir inside Slurm job
        rope_scaling:
          rope_type: yarn
          factor: 3.2                             # 131072 / 40960
          original_max_position_embeddings: 40960
    judge_vllm: *judge_vllm

# ============================================================================
# Model-Specific Stage Overrides
# ============================================================================

stages:

  # --------------------------------------------------------------------------
  # Validate Questions: only for finance_sec_search (equivalence gets context,
  # so "the company" references are unambiguous)
  # --------------------------------------------------------------------------
  validate_questions:
    source_data: /workspace/outputs/finance/demo/workflow-3-template-based-sdg/step-5-filter-answers
    environments:
      finance_sec_search: ${environments.finance_sec_search}
    stage_kwargs:
      model: /hf_models/openai/gpt-oss-120b
      server_gpus: 4
      server_args: "--max-model-len 65536 --async-scheduling --tensor-parallel-size 4"

  # --------------------------------------------------------------------------
  # Rollout Collection: Qwen3-4B configuration
  # --------------------------------------------------------------------------
  collect_rollouts:
    rollout:
      num_random_seeds: 8
      num_samples_in_parallel: 64  # WORKAROUND(vllm-0.17-hermes): x86-proven value; revert to 96 after vLLM fix
      policy_vllm:
        model_path: ${hf_model_path}
        num_gpus: 4  # Slurm het-group allocation (>= QOS min); TP derived from num_gpus
        # Per-env HF config overrides (e.g. YaRN rope_scaling for finance_sec_search)
        # are applied automatically via model overlay directories at launch time.
        # See hf_config_overrides above and create_overlay.py in lib/rl/.
        reasoning_parser: qwen3

  # --------------------------------------------------------------------------
  # Compute Rewards: re-judge with GPT-OSS-120B (optional)
  # --------------------------------------------------------------------------
  # Re-judges existing rollouts using GPT-OSS-120B.  Useful when
  # collect_rollouts ran with a different (e.g. weaker) judge and you
  # want to recompute rewards without regenerating model responses.
  #
  # Currently disabled in pipeline_stages (collect_rollouts already uses
  # the finance judge).  To enable: uncomment "compute_rewards" above.
  # compute_rewards: judge_vllm is configured per-environment (see environments above).
  # Alternative judge configurations can be set per-environment:
  #
  # environments:
  #   equivalence_llm_judge:
  #     judge_vllm:
  #       # OpenAI API judge:
  #       num_gpus: 0
  #       openai_base_url: "https://api.openai.com/v1"
  #       openai_model: "gpt-4o"
  #
  #       # Or local vLLM judge:
  #       num_gpus: 4
  #       model_path: /hf_models/Qwen/Qwen3-30B-A3B-Instruct-2507

  # --------------------------------------------------------------------------
  # Training: Qwen3-4B GRPO (equivalence_llm_judge, FSDP v2)
  # --------------------------------------------------------------------------
  # For finance_sec_search training, use qwen3_4b_finsec.yaml instead.
  training:
    model_name: Qwen/Qwen3-4B
    hf_checkpoint_path: ${hf_model_path}
    backend: fsdp
    total_gpus: 16
    dependent_jobs: 0
    preset: "grpo-base"

    overrides:
      grpo:
        num_prompts_per_step: 16
        num_generations_per_prompt: 8
        max_num_steps: 20
        val_period: 10

      checkpointing:
        save_period: 10

      policy:
        tokenizer:
          name: ${stages.training.hf_checkpoint_path}
        train_global_batch_size: 128
        generation:
          vllm_cfg:
            http_server_serving_chat_kwargs:
              reasoning_parser: qwen3

      logger:
        wandb:
          name: "grpo-qwen3-4b-equiv"

  # --------------------------------------------------------------------------
  # Evaluate Checkpoints (equivalence_llm_judge)
  # --------------------------------------------------------------------------
  # For finance_sec_search eval, use qwen3_4b_finsec.yaml instead.
  eval:
    eval_steps: [20]
    checkpoint_path: ${directories.step-8-training}/equivalence_llm_judge/grpo-qwen3-4b-16g-tp2-cp1-seq32k
    eval_output_dir: ${directories.step-9-eval}/equivalence_llm_judge
    base_output_dir: ${model_output_dir}/equivalence_llm_judge
    format: fsdp  # Triggers DCP/safetensors → HF conversion (auto-detects v1/v2)
    base_model: ${hf_model_path}
    server_type: vllm
    gpus: 4
    benchmarks:
      secque:
        seeds: 5
      financebench:
        seeds: 5
    inference_args: >-
      ++prompt_config=/workspace/nvflow/recipes/finance/prompts/secque_template.yaml
      ++inference.temperature=0.6
      ++inference.top_p=0.95
      ++inference.top_k=20
      ++inference.tokens_to_generate=16384
      ++chat_template_kwargs.enable_thinking=true
    server_args: "--max-model-len 40960 --async-scheduling --reasoning-parser qwen3 --tensor-parallel-size 2"
