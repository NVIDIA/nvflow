[project]
name = "nvflow"
dynamic = ["version"]  # Version determined from git tags via hatch-vcs
description = "Workflow orchestration for end-to-end model training on NeMo ecosystem"
authors = [
    {name = "Your Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

dependencies = [
    # nemo-skills (core orchestration framework, ~200+ deps) is provided by the
    # container or local checkout, not pip-resolved here. For a non-container
    # `uv sync` dev path, use the `skills` optional extra below.

    # Configuration & Workflow
    "omegaconf>=2.3.0",      # YAML config loading with variable interpolation

    # CLI Interface
    "typer>=0.9.0",          # CLI framework (includes click as dependency)
    "rich>=13.0.0",          # Pretty terminal output and tables

    # Data handling
    "jsonlines>=4.0.0",      # JSONL file reading/writing

    # urllib3>=2.6.3 blocked by torchx<1.27 constraint (via nemo-skills → nemo-run → torchx)

    # Note: Heavy dependencies (torch, transformers, etc.) come from nemo-skills
    # Actual compute happens on Slurm cluster inside containers
]

[project.optional-dependencies]
# Development tools (testing, linting, formatting, docs)
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.2.0",

    # Code quality
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-PyYAML",
]

# NeMo-Skills for running nflow FROM SOURCE without a container (local dev).
# Container/airgap users do NOT need this — the image bakes nemo-skills at
# NEMO_SKILLS_COMMIT (Dockerfile.nemo-skills). Pinned to 786d8c58 so the host
# `uv run nflow` path carries the same Ray Jobs backend fix as the container:
# nemo-skills passes `entrypoint_label_selector` to JobSubmissionClient.submit_job()
# only when the installed Ray supports it (the older 9cd1e07 passed it unconditionally,
# which crashes on Ray < 2.54 — the version a bare `uv run` resolves). Kept out of the
# base dependencies so the default `uv sync` stays lean and airgap-CI-safe; opt in with
# `uv sync --extra skills`.
skills = [
    "nemo-skills @ git+https://github.com/NVIDIA-NeMo/Skills.git@786d8c589f7c18095459e566367546b4ba5a70f2",
]

[project.scripts]
nflow = "nvflow.cli.main:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "nvflow/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatchling.build.targets.wheel]
packages = ["nvflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Disable strict checks for OmegaConf (dynamic config library)
[[tool.mypy.overrides]]
module = "nvflow.*"
disable_error_code = ["index", "call-overload", "union-attr", "arg-type", "no-any-return", "attr-defined", "assignment", "operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=nvflow --cov-report=html --cov-report=term-missing"
timeout = 300

[tool.uv]
managed = true
override-dependencies = [
    # Break leptonai's httpx[http2]==0.27.2 hard pin (pulled in via nemo-run)
    # so litellm 1.83.14 (which requires httpx==0.28.1) can be installed.
    # Mirrors the override added in nemo-skills/pyproject.toml (PR #1433),
    # but [tool.uv] from a dep is ignored — overrides must be at the top-level project.
    "httpx[http2]>=0.28.1",
    "urllib3>=2.6.3",
    # Force minimum versions of transitive deps for security/maintenance updates
    "cryptography>=47.0.0",
    "Pillow>=12.2.0",
    "Pygments>=2.20.0",
    "GitPython>=3.1.49",
    # Floor Ray to the version whose Jobs API client accepts entrypoint_label_selector
    # (added in 2.54.0). A bare resolve otherwise pins ray 2.53.0 via nemo-run→torchx,
    # which the nemo-skills Ray backend's submit_job() call cannot run. Matches the
    # container Ray floor (nemo-rl 2.54.0 / nemo-skills 2.55.1; both Jobs REST version:4).
    "ray[default]>=2.54.0",
]

[dependency-groups]
dev = [
    "pudb>=2025.1.3",
]
