[project]
name = "nvflow"
dynamic = ["version"]  # Version determined from git tags via hatch-vcs
description = "The workflow orchestration platform for NeMo-based data generation, training, and evaluation"
authors = [
    {name = "Your Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
license = {text = "Apache-2.0"}

dependencies = [
    # Configuration & Workflow
    "omegaconf>=2.3.0",      # YAML config loading with variable interpolation
    "packaging>=26.3",       # Validate requires_nvflow version specifiers
    "PyYAML>=6.0",           # Manifest, workflow, and target YAML parsing
    # CLI Interface
    "click>=8.1.0",          # Custom command ordering and CLI contexts
    "typer>=0.9.0",          # CLI framework
    "rich>=13.0.0",          # Pretty terminal output and tables
    # Data handling
    "jsonlines>=4.0.0",      # JSONL file reading/writing
    # Cross-platform ownership locks for atomic project-environment builds.
    "filelock>=3.20.0",
]

[project.optional-dependencies]
# Supplied-cluster Ray Jobs execution without installing the Slurm launcher
# stack. Imported lazily so the default/direct-Slurm path remains isolated.
ray = [
    "ray[default]==2.58.0",
]
# Full launcher stack used only inside maintained checkouts, client images, and
# NVFlow-managed project environments. External-project `uv sync` installs the
# lightweight CLI above, then semantic commands hand off into this stack.
execution = [
    # Pinned because nemo-skills has no version tags. Must match
    # NEMO_SKILLS_COMMIT in dockerfiles/Dockerfile.nemo-skills.
    "nemo-skills @ git+https://github.com/NVIDIA/NeMo-Skills.git@bcf059af55c20a89f797724598f9908d126153e6",
    # Declared directly only so the CPU index below can route it; version
    # ownership remains with the NeMo-Skills dependency graph.
    "torch",
]

# Development tools (testing, linting, formatting, docs)
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.2.0",

    # Code quality
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
nvflow = "nvflow.cli.bootstrap:main"

[build-system]
requires = ["hatchling==1.31.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
git_describe_command = "git describe --dirty --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*'"

[tool.hatch.build.hooks.vcs]
version-file = "nvflow/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["nvflow"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Disable strict checks for OmegaConf (dynamic config library)
[[tool.mypy.overrides]]
module = [
    "nvflow.*",
    "my_project.*",
    "nvfinance.*",
    "nvhopchain.*",
]
disable_error_code = ["index", "call-overload", "union-attr", "arg-type", "no-any-return", "attr-defined", "assignment", "operator"]

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=nvflow --cov-report=html --cov-report=term-missing"
timeout = 300
strict_markers = true
markers = [
    "requires_nemo: requires the full NeMo-Skills/NeMo-Run dependency stack",
]

[tool.uv]
managed = true
# Only a floor: CI and the client image install the latest uv. Raise it when
# NVFlow needs a newer uv, together with nvflow/project/environment.py.
required-version = ">=0.11.32"
# Keep these lists synchronized with nvflow/project/_environment_policy/.
# Project environments render the bundled policy into their synthetic uv project.
override-dependencies = [
    # Break leptonai's httpx[http2]==0.27.2 hard pin (pulled in via nemo-run)
    # so nemo-skills' litellm 1.84.10 (which requires httpx>=0.28) can be installed.
    # Mirrors the override added in nemo-skills/pyproject.toml (PR #1433),
    # but [tool.uv] from a dep is ignored — overrides must be at the top-level project.
    "httpx[http2]>=0.28.1",
    # NeMo-Skills depends on NeMo-Run HEAD. Pin the launcher API so root and
    # cache-owned project environments resolve the same tested commit.
    "nemo-run @ git+https://github.com/NVIDIA-NeMo/Run@17ae86b64d7f75653351664f5d8c9e466faede00",
    # Force minimum versions of transitive deps for security/maintenance updates
    "cryptography>=50.0.0",  # CVE-2026-69247
    "anyio>=4.14.2",  # an override because leptonai (via nemo-run) caps anyio at 4.9.0
    "Pygments>=2.20.0",
    "GitPython>=3.1.58",   # Clears all currently reported High GitPython advisories, including GHSA-wvpp-8hx9-p66j
    # Exact Ray/Python compatibility is an NVFlow execution contract.
    "ray[default]==2.58.0",
    "urllib3>=2.8.0",
    "transformers>=5.20.1",
    # CVE floors. NeMo-Skills patches LiteLLM internals, so litellm
    # moves one minor line at a time.
    # lxml>=6.1.0 clears High CVE-2026-41066 (info disclosure / local file read)
    "starlette>=1.3.1",
    "litellm>=1.106.0,<1.107",
    "lxml>=6.1.0",
    "gradio>=6.20.0",
]

# NSpect/Trivy HIGH CVE floors (2026-07-21) — transitive-only, raise lower bound.
constraint-dependencies = [
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.27",
    "aiohttp>=3.14.4",  # CVE-2026-69244, CVE-2026-111064, GHSA-2g87-pp6c-29x5
    "pyarrow>=23.0.1",
    "sentence-transformers>=5.6.0",
    "fsspec>=2026.6.0",
    # The first release whose fsspec cap admits the fixed fsspec; without it the
    # resolver falls back to datasets 1.1.1, which has no cap.
    "datasets>=5.0.1",
    # Older releases bundle a wandb-core binary built with vulnerable Go modules.
    "wandb>=0.31.2",
    # 0.47 drops leptonai.api.v1, which the pinned nemo-run imports.
    "leptonai<0.47",
    # v1.2.0 security floors (nSpect and Trivy scans, 2026-11-20). Each only raises a
    # lower bound; drop an entry once the packages that pull it in require the fix.
    "brotli>=1.2.1",  # BDSA-2026-38070
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2 (Critical)
    "filelock>=4.2.1",  # CVE-2026-112940; pulls litellm to 1.106.12
    "grpcio>=1.85.3",  # 1.85.0rc1 was yanked for GHSA-2xm2-c8xx-p9vh
    "hydra-core>=1.3.8",  # CVE-2026-106439, GHSA-wf6j-7hvr-gr93
    "mcp>=1.30.0",  # CVE-2026-115563
    "msgpack>=1.2.3",  # CVE-2026-114613
    "nltk>=3.10.4",  # CVE-2026-128138 (Critical) and 13 High CVEs
    "oauthlib>=4.0.1",  # BDSA-2026-39380, BDSA-2026-38625
    "pillow>=13.0.0",  # BDSA-2026-37877 and 11 more High; pulls gradio to 6.32.0
    "pyasn1>=0.6.5",  # CVE-2026-59886, CVE-2026-119194 to CVE-2026-119197
    "soupsieve>=4.0",  # CVE-2026-126190, CVE-2026-126191
    "virtualenv>=21.14.13",  # CVE-2026-115586
]

# Linux x86_64/aarch64 and Windows x86_64 torch from CPU wheels: PyPI's Linux
# wheels pull the CUDA runtime, which the client never uses. macOS PyPI torch is
# already CPU-only. explicit = only torch uses this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "(platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64') and sys_platform != 'darwin'" },
]

[dependency-groups]
dev = [
    "pudb>=2025.1.3",
]
# Lightweight, reproducible CI lanes.  These groups deliberately avoid the
# project's NeMo-Skills/Torch runtime stack; uv.lock still pins every resolved
# version and hash in one place.
ci = [
    # Required in the environment before the no-isolation editable build.
    "editables>=0.5,<1",
    "hatchling==1.31.0",
    "hatch-vcs==0.5.0",
    "datasketch>=2.0,<3",
    "jsonlines>=4,<5",
    "litellm>=1.106,<1.107",
    "markdownify>=1.2,<2",
    "omegaconf>=2.3,<3",
    "orjson>=3.11,<4",
    "pandas>=3,<4",
    "Pillow>=13,<14",
    "pyarrow>=23.0.1,<26",
    "pydantic>=2.12,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "PyYAML>=6,<7",
    "rich>=15,<16",
    "tenacity>=9.1,<10",
    "tiktoken>=0.12,<1",
    "typer>=0.21,<1",
    "build>=1.5.0",
]
lint = [
    "pre-commit>=4.5,<5",
]
build = [
    "build>=1.5,<2",
    "hatchling==1.31.0",
    "hatch-vcs==0.5.0",
]
publish = [
    "twine>=7,<8",
]
