[project]
name = "nvflow-project-starter"
version = "0.1.0"
requires-python = ">=3.13.14,<3.14"
dependencies = [
    "nvflow>=1.1,<2",
    # Add project-specific launcher dependencies below this line.
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_project"]

# Project-owned NVFlow version pin. Platform execution policy remains bundled
# in NVFlow and is not copied into this project.
[tool.uv.sources]
nvflow = { git = "https://github.com/NVIDIA/nvflow.git", rev = "v1.2.0" }
