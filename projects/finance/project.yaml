manifest_version: 1
project: finance
description: "End-to-end pipeline for financial model training and evaluation"
requires_nvflow: ">=1.1.3.dev0,<2"
python_source_root: .

recipes:
  quickstart:
    description: "Template-based SDG quickstart"
    workflows:
      eval/demo: {}
      download/demo: {}
      sdg/template-based-sdg-demo:
        depends_on: [download/demo]
      sft/qwen3_4b:
        depends_on: [eval/demo, sdg/template-based-sdg-demo]
      grpo/qwen3_4b:
        depends_on: [eval/demo, sdg/template-based-sdg-demo]

  template-based-sft:
    description: "Template-based SDG for single-turn SFT"
    workflows:
      eval/baselines: {}
      download/sp500: {}
      sdg/template-based-sdg:
        depends_on: [download/sp500]
      sft/qwen3_14b:
        depends_on: [eval/baselines, sdg/template-based-sdg]
      sft/nemotron-3-nano:
        depends_on: [eval/baselines, sdg/template-based-sdg]

  document-grounded-local-search-grpo:
    description: "Document-grounded SDG for multi-turn GRPO over a local SEC full-text index"
    workflows:
      eval/baselines:
        depends_on: [download/sp500]
      download/sp500: {}
      sdg/document-grounded-sdg-sp500:
        depends_on: [download/sp500]
      grpo/nemotron_nano_30b_a3b:
        depends_on: [download/sp500, eval/baselines, sdg/document-grounded-sdg-sp500]

  vals-no-web:
    description: "VALS-seeded template and relational SDG followed by Nano/Lightning SFT and Lightning GRPO"
    workflows:
      eval/baselines:
        depends_on: [download/sp500]
      download/sp500: {}
      sdg/template-based-sdg-vals-noweb:
        depends_on: [download/sp500]
      sdg/relational-sdg-hard-categories:
        depends_on: [download/sp500]
      sdg/relational-sdg-beat-or-miss:
        depends_on: [download/sp500]
      sdg/vals-agentic-trajectories:
        depends_on:
          - sdg/template-based-sdg-vals-noweb
          - sdg/relational-sdg-hard-categories
          - sdg/relational-sdg-beat-or-miss
      sft/nemotron-3-nano-vals-noweb:
        depends_on: [eval/baselines, sdg/vals-agentic-trajectories]
      sft/nemotron-3.5-lightning-30b-a3b-combined-noweb:
        depends_on: [eval/baselines, sdg/vals-agentic-trajectories]
      grpo/nemotron-3.5-lightning-combined-rl-noweb:
        depends_on: [eval/baselines, sft/nemotron-3.5-lightning-30b-a3b-combined-noweb]

  vals11:
    description: "VALS 1.1: baseline evaluations, the SFT and RL question sets, and their teacher traces"
    workflows:
      eval/baselines:
        depends_on: [download/sp500]
      download/sp500: {}
      sdg/vals11-prepare-sft:
        depends_on: [download/sp500, eval/baselines]
      sdg/vals11-prepare-rl:
        depends_on: [download/sp500, eval/baselines]
      sdg/vals11-teacher-sft-web-off:
        depends_on: [sdg/vals11-prepare-sft]
      sdg/vals11-teacher-sft-web-on:
        depends_on: [sdg/vals11-prepare-sft]
      sdg/vals11-teacher-sft-held-out-web-off:
        depends_on: [sdg/vals11-prepare-sft]
      sdg/vals11-teacher-sft-held-out-web-on:
        depends_on: [sdg/vals11-prepare-sft]
      sdg/vals11-teacher-rl-web-off:
        depends_on: [sdg/vals11-prepare-rl]
      sdg/vals11-teacher-rl-web-on:
        depends_on: [sdg/vals11-prepare-rl]
