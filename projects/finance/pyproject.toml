[project]
name = "nvflow-project-finance"
version = "0.1.0"
requires-python = ">=3.13.14,<3.14"
dependencies = [
    "nvflow>=1.1.3.dev0,<2",
]

[project.optional-dependencies]
# Imported only by packaged worker utilities and project-owned tests.
worker = [
    "beautifulsoup4",
    "datasets",
    "edgartools",
    "httpx",
    "jsonlines",
    "markdownify",
    "omegaconf",
    "orjson",
    "pandas",
    "PyYAML",
    "requests",
    "sec-parser",
    "tiktoken",
    "tqdm",
    "transformers",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nvfinance"]

# Project-owned NVFlow version pin. Platform execution policy remains bundled
# in NVFlow and is not copied into this project.
[tool.uv.sources]
nvflow = { git = "https://github.com/NVIDIA/nvflow.git", rev = "v1.2.0" }
