# ============================================================================
# Nemotron 3 Nano 30B-A3B GRPO Training Configuration (MoE, DG SDG)
# ============================================================================
# GRPO RL training for Nemotron 3 Nano 30B-A3B (Mixture of Experts) using
# Document-Grounded SDG hard_rl_data from S&P 500.
#
# Same MoE architecture as Qwen3-30B-A3B (128 experts, top-k=8).
# Shares data prep stages 0-4 with qwen3_30b_a3b.yaml.
# Separate model_output_dir for rollouts, training, and eval.
#
# Usage:
#   uv run nvflow run collect_rollouts --config .../nemotron_nano_30b_a3b.yaml --cluster my_cluster -e finance_sec_search
#   uv run nvflow run training --config .../nemotron_nano_30b_a3b.yaml --cluster my_cluster -e finance_sec_search
# ============================================================================

# Inherit base GRPO workflow
_base_: base.yaml
# Data scope: S&P 500 DG SDG data
scope: sp500
# Model identity (define once, reference everywhere via ${hf_model_path})
hf_model_path: /hf_models/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
# Model-specific output directory (stages 5-9: rollouts, rejudge,
# train_validation_split, training, eval write here).  Stages 0-4 (incl.
# prepare_data) write under ${base_output_dir} and are SHARED across output
# dirs, so changing this only affects step-5+ (cheap -- no data re-prep).
model_output_dir: ${base_output_dir}/nemotron_nano_30b_a3b
# Same pipeline as base.yaml -- listed here because YAML lists fully replace
# (not merge) when inherited via _base_, so we must re-declare.
pipeline_stages:
  - validate_questions
  - data_transformation
  - apply_prompt_template
  - convert_to_responses_api
  - prepare_data
  - collect_rollouts
  - train_validation_split
  - training
  - eval
# ============================================================================
# Shared Anchors (define once, reuse across stages)
# ============================================================================
# GPT-OSS-120B as dedicated judge (MoE). TP=1: the ~63GB MXFP4 weights fit a
# single 80GB H100. Validated on the May 29 smoke -- the judge ran at ~2% KV,
# Running ~0-1 reqs (it is invoked once per completed sample), so TP=2 was
# heavily over-provisioned. TP=1 halves judge GPUs AND keeps the het-job
# single-node (policy TP4 + judge TP1 = 5 GPUs / 1 node -> easy to schedule).
_judge_model: &judge_model
  model: /hf_models/openai/gpt-oss-120b
  num_gpus: 1
  server_nodes: 1
  gym_model:
    uses_reasoning_parser: true
    return_token_id_information: false
    # Disable the FlashInfer all-reduce fusion pass (emits --compilation-config).
    # Prevents the fixed-name localhost IPC workspace collision when this judge
    # TP2 server co-locates on a node with a policy TP4 server. See the policy
    # block under collect_rollouts for the full rationale.

    vllm_serve_kwargs:
      gpu_memory_utilization: 0.95
      max_model_len: 32768
      async_scheduling: true
      compilation_config: '{"pass_config":{"fuse_allreduce_rms":false}}'
  deployment: nvflow
_env_seq_len_32k: 32768
# Training sequence length -- single source of truth. Referenced via
# ${_train_seq_len} by the 5 training-side fields that must stay equal:
# max_total_sequence_length, generation.max_new_tokens, vllm_cfg.max_model_len,
# sequence_packing.train_mb_tokens, sequence_packing.logprob_mb_tokens.
_train_seq_len: 49152 # REFERENCE-MATCH (grpo_nanov3 = 49152). Was 131072 (OOM'd at train step).
_training_policy_32k: &training_policy_32k
  max_total_sequence_length: ${_env_seq_len_32k}
  hf_config_overrides: null # No YaRN needed at 32K (native context is 40960)
  megatron_cfg:
    context_parallel_size: 2 # CP=4 is for 131K; CP=2 sufficient for 32K
  generation:
    vllm_cfg:
      max_model_len: ${_env_seq_len_32k}
  sequence_packing:
    train_mb_tokens: ${_env_seq_len_32k}
    logprob_mb_tokens: ${_env_seq_len_32k}
# No YaRN needed for Nemotron Nano — model supports 131K natively
# (unlike Qwen3 which requires YaRN to extend beyond 40960)

# DG SDG data path (shared across equivalence_llm_judge and finance_sec_search).
# Consumers append final_result.jsonl, so this must be the post-process step
# directory rather than the SDG workflow root.
_dg_sdg_data: &dg_sdg_data /workspace/outputs/finance/sp500/workflow-3-document-grounded-sdg/step-6-post-process
# ============================================================================
# Environment Overrides
# ============================================================================
# answer_prefix: null for all environments.
# DG SDG `answer` field has no "Answer:" prefix. The full answer text
# (1-2K chars) serves as the GOLD reference, enabling partial rewards
# from the 3-point finance judges. Revisit if training a non-thinking model.
environments:
  equivalence_llm_judge:
    raw_train_data: *dg_sdg_data
    answer_prefix: null
    models:
      judge: *judge_model
    training_policy: *training_policy_32k
  mcqa:
    training_repeat: 2
    training_policy: *training_policy_32k
  finance_sec_search:
    # IMPORTANT: raw_train_data points at the validate_questions output,
    # NOT the raw SDG.  The validate_questions stage reads from *dg_sdg_data
    # (via stages.validate_questions.source_data below) and writes the
    # filtered dataset to ${directories.step-0-validate-questions}/finance_sec_search/.
    # data_transformation then reads via this path as it always has.
    # If validate_questions is removed from pipeline_stages, revert this to
    # *dg_sdg_data.
    raw_train_data: ${directories.step-0-validate-questions}/finance_sec_search
    # Answers come from the index build_index builds, not sec.gov.
    prompt_template: project://prompts/finance_sec_search_template_edgar_search_without_web.yaml
    config_paths:
      - resources_servers/finance_sec_search/configs/finance_sec_search.yaml
    models:
      policy:
        num_gpus: 4
        gym_model:
          vllm_serve_kwargs:
            max_model_len: 131072
      judge: *judge_model
# ============================================================================
# Model-Specific Stage Overrides
# ============================================================================
stages:
  # --------------------------------------------------------------------------
  # Validate Questions: GPT-OSS-120B pre-filter
  # --------------------------------------------------------------------------
  # Always invoke with `-e finance_sec_search` — the SEC-filings rubric doesn't
  # apply to equivalence_llm_judge / mcqa question distributions.
  #
  # stage_kwargs goes straight to NVFlow's NeMo-Skills generate adapter, so keys
  # must match its signature (model / server_gpus / server_args / ...).  Do NOT
  # spread the _judge_model anchor here — its keys (model_path / num_gpus /
  # max_model_len / ...) are rejected by generate().
  validate_questions:
    source_data: *dg_sdg_data
    stage_kwargs:
      model: /hf_models/openai/gpt-oss-120b
      server_type: vllm
      server_gpus: 4
      server_nodes: 1
      # Single chunk: 10K dryrun extrapolates to ~42-90 min for the full
      # ~379K prefiltered records on one 4-GPU server, well under the
      # 4h Slurm timeout.  Runs 1 job instead of 8 = 1/8 the cluster
      # GPU-hour footprint with a moderate wall-clock tradeoff.
      # If resilience against a single-job timeout becomes a concern,
      # bump num_chunks to 2-4 as a middle ground.
      num_chunks: 1
      # Concurrency lever is --max-num-seqs (vLLM's 1024 default was the
      # binding cap in dryrun measurements); --max-num-batched-tokens
      # is slack for prefill bursts.  Both are scheduler-only, no
      # quality impact.
      server_args: >-
        --max-model-len 65536 --async-scheduling --reasoning-parser openai_gptoss --max-num-batched-tokens 32768 --max-num-seqs 4096
      # No stage-level inline_args override here -- we inherit base.yaml's
      # default (reasoning_effort=high, tokens_to_generate=8192,
      # max_concurrent_requests=2048) which has no max_samples cap, so the
      # LLM processes every prefiltered record.
  # --------------------------------------------------------------------------
  # Rollout Collection: Nemotron-Nano-30B-A3B configuration
  # --------------------------------------------------------------------------
  # ROLLOUT ↔ TRAINING ALIGNMENT CONTRACT
  # --------------------------------------------------------------------------
  # The rollout policy vLLM and the training policy vLLM serve the SAME
  # model and consume the SAME generated text, so the parser settings
  # must match end-to-end.  Concretely, these rollout `models.policy.gym_model.vllm_serve_kwargs`
  # keys must agree with the corresponding training keys under
  # `stages.training.overrides.policy.generation.vllm_cfg`:
  #
  #   rollout models.policy.gym_model.vllm_serve_kwargs                 training vllm_cfg
  #   --------------------                --------------------------------
  #   reasoning_parser    <==>            http_server_serving_chat_kwargs.reasoning_parser
  #   tool_call_parser    <==>            http_server_serving_chat_kwargs.tool_parser
  #
  # If these drift, the policy logprobs computed during rollout are based
  # on a different decomposition of the model's output than what the
  # trainer sees -- silently degrading the GRPO signal (e.g., reasoning
  # tags leaking into the answer field, missed tool calls in
  # finance_sec_search).  Eval's `--reasoning-parser` should also match
  # for benchmark numbers to reflect training behaviour.
  #
  # When adding a new model, copy this block from the matching model
  # (don't copy from a different family) and update both parsers in
  # lockstep with the training overrides below.
  collect_rollouts:
    rollout:
      # 36K reward-profiling run under a 120-GPU cap.
      # 24 native chunks × 8 Gym repeats preserve the former work per job:
      # 1,500 tasks/chunk × 8 repeats = 12K rollouts. Each five-GPU chunk
      # has four chained attempts (dependent_jobs: 3) for the 4h Slurm limit.
      # Resume requires unchanged source digest, sample limit, and chunk count;
      # expand into a new output directory or a disjoint batch.
      num_repeats: 8
      num_chunks: 24
      dependent_jobs: 3
      max_num_samples: 36000
      num_samples_in_parallel: 512
      models:
        policy:
          model: ${hf_model_path}
          num_gpus: 4 # TP = 4 (one node, 4 GPUs)
          server_nodes: 1
          gym_model:
            vllm_serve_kwargs:
              max_num_seqs: 448
              # To scale with data parallelism (multi-node vLLM):
              #   data_parallel_size: 2      # DP replicas; increase with server_nodes + num_samples_in_parallel
              #   data_parallel_backend: ray  # multi-node DP via Ray
              # Note: for agentic workloads (multi-turn tool use), DP>1 may not
              # improve throughput — the bottleneck is client-side orchestration,
              # not GPU inference.
              # Reasoning + tool parsers MUST match the training-side
              # http_server_serving_chat_kwargs below (deepseek_r1 / qwen3_coder
              # for Nemotron-Nano-30B-A3B).  See ALIGNMENT CONTRACT above.
              reasoning_parser: deepseek_r1
              # Override base.yaml's default `tool_call_parser: hermes` -- Nemotron-Nano
              # emits tool calls in qwen3_coder format, hermes parser would silently
              # drop multi-turn tool invocations in finance_sec_search.
              tool_call_parser: qwen3_coder
              # Disable the FlashInfer all-reduce fusion pass (emits --compilation-config).
              # The pass allocates a fixed-name localhost IPC workspace; when this
              # policy TP4 server co-locates on a node with another job's judge TP2
              # server (SLURM packing), the loser hits `[Errno 98] Address already in
              # use`, leaving TP ranks inconsistent -> shm_broadcast hang -> ~600s NCCL
              # watchdog kill. Skipping the pass keeps all ranks consistent regardless
              # of co-location. (Confirmed fix on the qwen3_30b_a3b smoke.)
              compilation_config: '{"pass_config":{"fuse_allreduce_rms":false}}'
              # --------------------------------------------------------------------------
              # Train/Validation Split: curriculum ordering for GRPO
              # --------------------------------------------------------------------------
              # Sort train.jsonl by offline difficulty (easy-to-hard) instead of shuffling.
              # Early training steps see high-reward prompts → strong GRPO gradients.
  train_validation_split:
    sort_by: "difficulty_profile.avg_reward"
    sort_order: "desc"
  # --------------------------------------------------------------------------
  # Training: Nemotron 3 Nano 30B-A3B GRPO configuration (Megatron, MoE)
  # --------------------------------------------------------------------------
  # data_source_dir and dependencies are inherited from base.yaml
  # (step-7-train-validation-split / [train_validation_split]) since we use
  # the default post-rollout split.  Only model-specific fields below.
  training:
    model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    hf_checkpoint_path: ${hf_model_path}
    # Megatron backend required for MoE expert parallelism
    backend: megatron
    # PRODUCTION, 128 GPU (DP=1): TP(4) x CP(8) x PP(4) = 128 -> DP = 128/128 = 1.
    total_gpus: 128
    dependent_jobs: 4 # chain 5 jobs (~50 steps)
    wandb_mode: online
    preset: "grpo-base"
    overrides:
      data:
        shuffle: false
      grpo:
        num_prompts_per_step: 128 # PRODUCTION (global batch = 128 * 16 = 2048)
        num_generations_per_prompt: 16 # nano-v3 ref (was 8); KEEP (GRPO group size)
        max_num_epochs: 1
        max_num_steps: 300 # production (preset default 1000000)
        val_period: 10
        val_at_start: true
        val_at_end: true
        val_batch_size: 256 # nano-v3 ref
        val_num_generations_per_prompt: 4 # nano-v3 ref
        overlong_filtering: true # nano-v3 ref (preset default false)
        seq_logprob_error_threshold: 2 # nano-v3 ref (preset default null)
        use_dynamic_sampling: false # follow ref (was true)
        batch_multiplier: 1 # follow ref (was 2)
      # Loss: canonical Nano-v3 recipe -- token-level GRPO + importance-sampling
      # correction + on-policy KL approximation + DAPO asymmetric clip.
      # Adopted from NeMo-RL's examples/nemo_gym/grpo_nanov3.yaml, which matches
      # the loss used in Nemotron post-training. Replaces the prior GSPO setup.
      loss_fn:
        token_level_loss: true
        sequence_level_importance_ratios: false
        ratio_clip_min: 0.2
        ratio_clip_max: 0.28
        use_on_policy_kl_approximation: true
        use_importance_sampling_correction: true
        kl_input_clamp_value: null
        kl_output_clamp_value: null
      checkpointing:
        metric_name: "val:total_reward/mean" # nano-v3 ref (preset uses val:accuracy)
        # Eval reads step_20 after training, so every save_period checkpoint is
        # kept; crash-recovery saves cap work-loss and keep only the newest.
        save_period: 20
        keep_top_k: null
        ft_save_period: 5
        ft_keep_latest_k: 1
        checkpoint_must_save_by: null # unset so it tracks the partition timeout
      policy:
        tokenizer:
          name: ${stages.training.hf_checkpoint_path}
        # Nano supports 131K natively — no YaRN needed
        hf_config_overrides: {}
        max_total_sequence_length: ${_train_seq_len}
        generation_batch_size: 64 # nano-v3 ref (preset=32)
        generation:
          port_range_low: 11001
          port_range_high: 15000
          max_new_tokens: ${_train_seq_len}
          vllm_cfg:
            async_engine: true
            tensor_parallel_size: 4
            gpu_memory_utilization: 0.5
            max_model_len: ${_train_seq_len}
            enforce_eager: false
            use_deep_gemm: false
            expose_http_server: true
            http_server_serving_chat_kwargs:
              enable_auto_tools: true
              tool_parser: qwen3_coder
              reasoning_parser: nano_v3
            reasoning_parser_plugin: /opt/nemo-rl/nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
          vllm_kwargs:
            compilation_config:
              backend: eager
            mamba_ssm_cache_dtype: float32
        train_global_batch_size: 2048 # PRODUCTION = 128 prompts * 16 gens (nano-v3 ref)
        # Megatron parallelism for MoE (128 GPU, PRODUCTION).
        # Both data-parallel widths must stay 1. A wider group makes NCCL build a
        # gradient reduce-scatter communicator at the end of the first backward pass,
        # when device memory is already at peak, and it OOMs there. Optimizer state
        # does not need DP sharding because optimizer_cpu_offload holds all of it
        # in host memory.
        # - Dense  DP  = 128 / (TP*CP*PP)  = 128/128 = 1
        # - Expert EDP = 128 / (ETP*EP*PP) = 128/128 = 1
        # pipeline_model_parallel_size must divide the model's 52 layers:
        # 1, 2, 4, 13, 26 or 52.
        megatron_cfg:
          tensor_model_parallel_size: 4
          pipeline_model_parallel_size: 4
          context_parallel_size: 8
          expert_model_parallel_size: 32
          expert_tensor_parallel_size: 1
          sequence_parallel: true
          activation_checkpointing: true
          empty_unused_memory_level: 2
          moe_token_dispatcher_type: alltoall
          freeze_moe_router: true
          bias_activation_fusion: false
          defer_fp32_logits: true
          moe_router_dtype: fp32
          moe_router_load_balancing_type: none # "seq_aux_loss" causes logprob divergence
          moe_router_bias_update_rate: 1.0e-3
          moe_router_enable_expert_bias: true
          moe_permute_fusion: true # ~20% training perf
          moe_enable_deepep: false
          moe_aux_loss_coeff: 0.0
          moe_shared_expert_overlap: false
          moe_per_layer_logging: true
          track_moe_metrics: true
          apply_rope_fusion: true
          gradient_accumulation_fusion: false
          env_vars: # NCCL flags for 16-node CP-ring stability
            NCCL_CUMEM_ENABLE: '0'
            NCCL_NET_GDR_LEVEL: '0' # stage CP-ring transport through host mem (fixes 16-node hang)
            NCCL_NVLS_ENABLE: '0'
            # NCCL's default 64 channels ask for channels * BUFFSIZE * 2 =
            # 64 * 4MB * 2 = 512MB in a single allocation, during the first backward
            # pass. 8 channels at a 2MB buffer keeps that off the OOM path. If you
            # change parallelism and hit an OOM at the first backward, check this first.
            NCCL_MAX_NCHANNELS: '8'
            NCCL_BUFFSIZE: '2097152'
          optimizer:
            optimizer: adam
            lr: 3.0e-6
            min_lr: 3.0e-6
            weight_decay: 0.0
            bf16: true
            fp16: false
            params_dtype: float32
            adam_beta1: 0.9
            adam_beta2: 0.999
            adam_eps: 1.0e-8
            clip_grad: 1.0
            use_distributed_optimizer: true # shards optimizer state across DP ranks
            use_precision_aware_optimizer: true # reduced-precision optimizer state (TE)
            optimizer_cpu_offload: true # PRODUCTION: offload optimizer to CPU (fits 80GB H100)
            optimizer_offload_fraction: 1.0
          scheduler:
            start_weight_decay: 0.0
            end_weight_decay: 0.0
            weight_decay_incr_style: constant
            lr_decay_style: constant
            lr_decay_iters: null
            lr_warmup_iters: 10
            lr_warmup_init: 3.0e-7
          distributed_data_parallel_config:
            grad_reduce_in_fp32: false
            overlap_grad_reduce: true
            overlap_param_gather: true
            average_in_collective: false
            use_custom_fsdp: false
            data_parallel_sharding_strategy: optim_grads_params
        sequence_packing:
          enabled: true
          train_mb_tokens: ${_train_seq_len} # = max_total_sequence_length
          logprob_mb_tokens: ${_train_seq_len}
        logprob_chunk_size: 2048
        # = TP(4)*CP(8)*2 = 64 (grpo_nanov3 formula). Hardcoded because nvflow
        # lacks the ${mul:} resolver the reference uses; update if TP or CP change.
        make_sequence_length_divisible_by: 64
        max_grad_norm: 1.0
        offload_optimizer_for_logprob: false
        optimizer: null # remove FSDP optimizer (megatron uses megatron_cfg.optimizer)
        scheduler: null # remove FSDP scheduler (megatron uses megatron_cfg.scheduler)
      # Logger
      logger:
        wandb:
          name: "grpo-nemotron-nano-30b-a3b"
  # --------------------------------------------------------------------------
  # Stage 9: Evaluate Checkpoints - Qwen3-30B-A3B GRPO
  # --------------------------------------------------------------------------
  # Stage 9: Evaluate Checkpoints - Nemotron 3 Nano 30B-A3B
  # --------------------------------------------------------------------------
  eval:
    eval_steps: [20]
    eval_data_root: /workspace/outputs/finance/baselines/step-1-eval-data  # prepared by eval/baselines
    # Training derives its run directory as grpo-<model>-<gpus>g-tp<tp>-cp<cp>-seq<len>k,
    # so these track the parallelism instead of pinning a stale tp2-cp16.
    checkpoint_path: ${directories.step-8-training}/finance_sec_search/grpo-nvidia-nemotron-3-nano-30b-a3b-bf16-${stages.training.total_gpus}g-tp${stages.training.overrides.policy.megatron_cfg.tensor_model_parallel_size}-cp${stages.training.overrides.policy.megatron_cfg.context_parallel_size}-seq48k
    eval_output_dir: ${directories.step-9-eval}/finance_sec_search
    base_output_dir: ${model_output_dir}
    format: megatron
    base_model: ${hf_model_path}
    preset: nemotron_3_nano_30b
    benchmarks: [secque, financebench]
