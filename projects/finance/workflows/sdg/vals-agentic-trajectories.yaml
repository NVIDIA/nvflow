# ==========================================================================
# VALS-seeded agentic trajectory generation
# ==========================================================================
# Combines TSDG questions with verified hard-category and Beat-or-Miss RSDG
# questions, generates four full finance-agent trajectories with each of
# DeepSeek-V4-Pro and Qwen3.5-397B-A17B, applies GenSelect plus answerability
# filtering, and recovers the exact selected trajectory in OpenAI messages
# format for SFT.

_base_: ../grpo/base.yaml

workflow:
  name: "vals_agentic_trajectories"
  type: "sdg"
  description: "Generate and select full no-web finance-agent trajectories from VALS-seeded questions"

scope: vals-noweb
data_root: /workspace/outputs/finance/vals-noweb
base_output_dir: ${data_root}/agentic-trajectories

pipeline_stages:
  - prepare_agent_questions
  - data_transformation
  - apply_prompt_template
  - convert_to_responses_api
  - prepare_data
  - collect_rollouts_deepseek
  - collect_rollouts_qwen
  - genselect_answers
  - filter_answers
  - extract_selected_trajectories

directories:
  step-0-agent-questions: ${base_output_dir}/step-0-agent-questions
  # Shared cache populated by the finance:download/sp500 workflow.
  cache-finance-sec-search: /workspace/outputs/finance/sp500/workflow-2-download-sec/cache/finance_sec_search
  step-5-deepseek-rollouts: ${base_output_dir}/step-5-deepseek-rollouts
  step-6-qwen-rollouts: ${base_output_dir}/step-6-qwen-rollouts
  step-7-genselect: ${base_output_dir}/step-7-genselect
  step-8-filter: ${base_output_dir}/step-8-filter
  step-9-selected-trajectories: ${base_output_dir}/step-9-selected-trajectories

environments:
  equivalence_llm_judge:
    raw_train_data: null
  finance_sec_search:
    raw_train_data: ${directories.step-0-agent-questions}
    source_format: inline
    gym:
      finance_sec_search_resources_server:
        resources_servers:
          finance_sec_search:
            sec_dump_path: /workspace/outputs/finance/sp500/workflow-2-download-sec/step-0-download/data
            # This workflow advertises sec_filing_search, not edgar_search.
            edgar_search_mode: null
            local_edgar_index_path: null
            judge_model_server: null
            judge_responses_create_params: null

stages:
  prepare_agent_questions:
    uses: project:nvfinance.stages.sdg.prepare_agent_questions:PrepareAgentQuestionsStage
    output_dir: ${directories.step-0-agent-questions}
    output_file: ${directories.step-0-agent-questions}/final_result.jsonl
    sources:
      - path: /workspace/outputs/finance/vals-noweb/template-based-sdg/step-2-generate-questions/final_result.jsonl
        format: jsonl
      - path: /workspace/outputs/finance/vals-noweb/relational-sdg-hard-categories/step-1-questions/verified
        format: verified_rollouts
      - path: /workspace/outputs/finance/vals-noweb/relational-sdg-beat-or-miss/step-1-questions/verified
        format: verified_rollouts
    dependencies: []

  data_transformation:
    input_filename: final_result.jsonl
    dependencies: [prepare_agent_questions]

  apply_prompt_template:
    sec_metadata_parquet: null

  collect_rollouts_deepseek:
    uses: nemo_gym.collect
    contract_version: 1
    output_dir: ${directories.step-5-deepseek-rollouts}
    container: nemo-gym
    vllm_container: ${vllm_container}
    environments: ${environments}
    dependencies: [prepare_data]
    installation_command: ${stages.prepare_data.installation_command}
    rollout:
      num_samples_in_parallel: 16
      max_num_samples: null
      num_chunks: 4
      num_repeats: 4
      dependent_jobs: 3
      responses_create_params:
        temperature: 1.0
        top_p: 1.0
        max_output_tokens: 32768
      models:
        policy:
          model: /hf_models/DeepSeek-V4-Pro
          num_gpus: 8
          server_nodes: 2
          deployment: nvflow
          gym_model:
            uses_reasoning_parser: true
            chat_template_kwargs:
              enable_thinking: true
            vllm_serve_kwargs:
              tensor_parallel_size: 8
              data_parallel_size: 2
              data_parallel_backend: ray
              max_model_len: 131072
              max_num_seqs: 8
              dtype: bfloat16
              kv_cache_dtype: fp8
              enable_auto_tool_choice: true
              tool_call_parser: deepseek_v4
              reasoning_parser: deepseek_v4
              enable_expert_parallel: true
              enable_prefix_caching: true
              disable_custom_all_reduce: true
              language_model_only: true
              tokenizer_mode: deepseek_v4
              enforce_eager: true
              block_size: 256
              distributed_executor_backend: ray
              trust_remote_code: true

  collect_rollouts_qwen:
    uses: nemo_gym.collect
    contract_version: 1
    output_dir: ${directories.step-6-qwen-rollouts}
    container: nemo-gym
    vllm_container: ${vllm_container}
    environments: ${environments}
    dependencies: [prepare_data]
    installation_command: ${stages.prepare_data.installation_command}
    rollout:
      num_samples_in_parallel: 8
      max_num_samples: null
      num_chunks: 8
      num_repeats: 4
      dependent_jobs: 3
      responses_create_params:
        temperature: 0.6
        top_p: 0.95
        max_output_tokens: 65536
      models:
        policy:
          model: /hf_models/Qwen3.5-397B-A17B
          num_gpus: 8
          server_nodes: 2
          deployment: nvflow
          gym_model:
            uses_reasoning_parser: true
            vllm_serve_kwargs:
              tensor_parallel_size: 16
              data_parallel_size: 1
              max_model_len: 262144
              dtype: bfloat16
              enable_auto_tool_choice: true
              tool_call_parser: qwen3_coder
              reasoning_parser: qwen3
              language_model_only: true
              distributed_executor_backend: ray

  genselect_answers:
    uses: project:nvfinance.stages.sdg.genselect_answers:GenselectAnswersStage
    input_files:
      - ${directories.step-5-deepseek-rollouts}/finance_sec_search/jobs/job-1-analyze-rollouts/outputs/rollouts.jsonl
      - ${directories.step-6-qwen-rollouts}/finance_sec_search/jobs/job-1-analyze-rollouts/outputs/rollouts.jsonl
    output_file: ${directories.step-7-genselect}/selected_answers.jsonl
    prompt_config: project://prompts/genselect_answers_no_context.yaml
    preprocess_args: "--strip_context --shuffle_solutions --shuffle_seed 42"
    inline_args: "++inference.tokens_to_generate=16384 ++max_concurrent_requests=180"
    dependencies: [collect_rollouts_deepseek, collect_rollouts_qwen]
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-235B-A22B-Instruct-2507-tp16-sglang
      server_type: sglang
      server_gpus: 8
      server_nodes: 2
      num_chunks: 10
      server_args: "--load-format sharded_state"

  filter_answers:
    uses: project:nvfinance.stages.sdg.filter_answers:FilterAnswersStage
    input_file: ${directories.step-7-genselect}/selected_answers.jsonl
    output_file: ${directories.step-8-filter}/final_result.jsonl
    prompt_config: project://prompts/filter_answers.yaml
    inline_args: "++generation_key=filter_generation ++inference.tokens_to_generate=4192"
    dependencies: [genselect_answers]
    stage_kwargs:
      model: /hf_models/Qwen/Qwen3-235B-A22B-Instruct-2507-tp16-sglang
      server_type: sglang
      server_gpus: 8
      server_nodes: 2
      num_chunks: 10
      server_args: "--load-format sharded_state"

  extract_selected_trajectories:
    uses: project:nvfinance.stages.sft.extract_selected_trajectories:ExtractSelectedTrajectoriesStage
    selection_file: ${directories.step-8-filter}/final_result.jsonl
    rollout_files: ${stages.genselect_answers.input_files}
    output_dir: ${directories.step-9-selected-trajectories}
    output_file: ${directories.step-9-selected-trajectories}/messages.jsonl
    dependencies: [filter_answers]
