# Relational SDG configuration used for the all-combinations hard-category
# campaign. The weights are requested sampling allocations, not empirical
# output shares: unavailable or filtered relations can change realized yield.

_base_: relational-sdg.yaml

workflow:
  # Distinct name so NeMo-Run experiment names (and their stale-experiment
  # cleanup) do not collide with other relational SDG variants running at once.
  name: "rsdg_hard_categories_vals_noweb"
  description: "Relational SDG for VALS-style hard finance categories"

base_data_dir: /workspace/outputs/finance/vals-noweb/relational-sdg-hard-categories

# This VALS path produces verified questions only. Full open-context answers
# and tool trajectories are generated by vals-agentic-trajectories.yaml.
pipeline_stages:
  - dg_sdg_preprocess
  - generate_verified_questions

stages:
  dg_sdg_preprocess:
    total_samples: 5000
    max_skip_count: 20000
    extra_args:
      # Historical all-combinations allocation: 57% relational contexts and
      # the remaining 43% through the ordinary document-grounded path.
      multi_period_weight: 0.18
      cross_form_weight: 0.14
      same_year_multi_filing_weight: 0.08
      cross_form_multi_period_weight: 0.06
      multi_company_multi_year_weight: 0.05
      multi_company_cross_form_weight: 0.03
      multi_form_weight: 0.03

      multi_period_section_boost: '{"8-K": {"2-2": 5.0}, "8-K_A": {"2-2": 5.0}}'
      multi_period_max_periods: '{"8-K": 6, "8-K_A": 6}'
      multi_company_multi_year_max_gap: 3
      same_year_multi_filing_min: 3
      same_year_multi_filing_max: 5
      multi_form_min_forms: 3
      multi_form_max_forms: 5

      # Preserve the form mix used by the original campaign.
      form_weights: '{"10-K": 3796, "10-Q": 3523, "8-K": 3948, "4": 4212, "DEF 14A": 3434, "4_A": 1055, "FWP": 1575, "8-K_A": 736, "10-K_A": 114, "10-Q_A": 33, "S-1": 18, "S-1_A": 12, "6-K": 1, "20-F": 1}'

  generate_verified_questions:
    question_generation_kwargs:
      args:
        model: /hf_models/Qwen3.5-397B-A17B
        num_gpus: 8
        server_nodes: 2
        num_chunks: 1
        tool_call_parser: qwen3_coder
        enable_auto_tool_choice: true
        language_model_only: true
        distributed_executor_backend: ray
      ctx_args: >-
        ++prompt_config=project://prompts/relational_hard_categories_generate_questions.yaml
        ++inference.temperature=0.9
        ++inference.top_p=0.9
        ++chat_template_kwargs.reasoning_effort=high
