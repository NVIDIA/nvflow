[project]
name = "nvflow-project-hopchain"
version = "0.1.0"
requires-python = ">=3.13.14,<3.14"
dependencies = [
    "nvflow>=1.1",
    "pydantic",
]

[project.optional-dependencies]
# Imported by packaged worker utilities; launcher stages use typed config only.
worker = [
    "litellm",
    "Pillow>=12.3.0",
    "tenacity>=9.1.2",
    "torch",
    "tqdm",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nvhopchain"]

# Project-owned NVFlow version pin. Platform execution policy remains bundled
# in NVFlow and is not copied into this project.
[tool.uv.sources]
nvflow = { git = "https://github.com/NVIDIA/nvflow.git", rev = "v1.2.0" }
