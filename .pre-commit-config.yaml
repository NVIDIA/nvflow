repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: '^uv\.lock$'
      - id: check-merge-conflict
      - id: detect-private-key

  # NVIDIA Apache 2.0 license header on Python files
  - repo: local
    hooks:
      - id: check-license-headers
        name: check-license-headers
        entry: python scripts/check_license_headers.py
        language: system
        types: [python]
        pass_filenames: true

  # DCO: require Signed-off-by in commit message
  - repo: local
    hooks:
      - id: check-dco
        name: check-dco
        entry: python scripts/check_dco.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff
        args: [check, --select, I, --fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-tqdm]
        args: [--ignore-missing-imports]
