name: Secrets detector

env:
  TRUFFLEHOG_VERSION: "3.96.0"
  TRUFFLEHOG_INSTALLER_COMMIT: "6f3c981e7b77f235fd2702dd74af25fc4b72bf11"
  TRUFFLEHOG_INSTALLER_SHA256: "c394defeaea8a7c48f828a2051b608a9b19f43f34b891407b66a386c3e2591e2"

on:
  pull_request:

jobs:
  secrets-detector:
    name: Secrets detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install trufflehog
        run: |
          curl -sSfL -o /tmp/install-trufflehog.sh "https://raw.githubusercontent.com/trufflesecurity/trufflehog/$TRUFFLEHOG_INSTALLER_COMMIT/scripts/install.sh"
          printf '%s  %s\n' "$TRUFFLEHOG_INSTALLER_SHA256" /tmp/install-trufflehog.sh | sha256sum -c -
          sudo sh /tmp/install-trufflehog.sh -b /usr/local/bin "v$TRUFFLEHOG_VERSION"
          trufflehog --version

      # --results=verified,unknown drops findings verified as harmless, which is
      # what keeps pinned git SHAs from reading as Weights & Biases keys.  Wheels
      # are excluded because vendored packages ship example credentials in
      # docstrings.  An empty base SHA silently widens the scan to every ref, and
      # the base bounds history but not the set of refs -- hence --branch HEAD.
      # Lob is excluded because its key pattern is `(live|test)_` plus 35 word
      # characters, which every descriptive pytest name matches; this repo uses no
      # Lob API, so the detector can only produce false positives here.
      # Keep the flags in sync with any other CI job that runs this scan.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -n "$BASE_SHA" || { echo "empty base SHA; refusing to scan every ref"; exit 1; }
          trufflehog git file://. --since-commit "$BASE_SHA" --branch HEAD --fail --no-update --results=verified,unknown --exclude-globs='*.whl' --exclude-detectors=Lob
