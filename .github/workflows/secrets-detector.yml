name: Secrets detector

on:
  pull_request:

jobs:
  secrets-detector:
    name: Secrets detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      # --results=verified,unknown drops findings verified as harmless, which is
      # what keeps pinned git SHAs from reading as Weights & Biases keys.  Wheels
      # are excluded because vendored packages ship example credentials in
      # docstrings.  An empty base SHA silently widens the scan to every ref, and
      # the base bounds history but not the set of refs -- hence --branch HEAD.
      # Keep the flags in sync with the secrets-detector job in .gitlab-ci.yml.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -n "$BASE_SHA" || { echo "empty base SHA; refusing to scan every ref"; exit 1; }
          trufflehog git file://. --since-commit "$BASE_SHA" --branch HEAD --fail --no-update --results=verified,unknown --exclude-globs='*.whl'
